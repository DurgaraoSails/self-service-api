name: build docker image and push to docker hub
on:
  push:
    branches:
      - main
      - develop
      - SS-Package-Structure
      - bravo-smtp
permissions:
  contents: write
  packages: write
env:
  IMAGE_NAME: self-service-api
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate image tag
        id: version
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          BRANCH_NAME=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]')
      
          RUN_NUMBER="${GITHUB_RUN_NUMBER}"
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
      
          IMAGE_TAG="${BRANCH_NAME}-${RUN_NUMBER}-${SHORT_SHA}"
      
          GHCR_OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
      
          GHCR_IMAGE="ghcr.io/${GHCR_OWNER}/self-service-api"
      
          DOCKERHUB_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/self-service-api"
      
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_image=${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"

          echo "Image tag: ${IMAGE_TAG}"
          echo "GHCR image: ${GHCR_IMAGE}"
          echo "Docker Hub image: ${DOCKERHUB_IMAGE}"
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.version.outputs.dockerhub_image }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.ghcr_image }}:${{ steps.version.outputs.tag }}
      - name: Display image information
        run: |
          echo "Docker Hub:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}"

          echo "GitHub Container Registry:"
          echo "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}"