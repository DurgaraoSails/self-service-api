steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          -t gcr.io/$PROJECT_ID/api \
          -f apps/api/Dockerfile \
          apps/api
        docker push gcr.io/$PROJECT_ID/api
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'api-service', '--image=gcr.io/$PROJECT_ID/api', '--port=7000']
