steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/app', '.']
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'app'
      - '--image=gcr.io/$PROJECT_ID/app'
      - '--port=8080'
      - '--timeout=600'
      - '--concurrency=40'
      - '--no-cpu-throttling'
      - '--vpc-connector=my-connector'
      - '--no-allow-unauthenticated'
