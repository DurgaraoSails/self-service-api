steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/web', '-f', 'apps/web/Dockerfile', 'apps/web']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/api', '-f', 'apps/api/Dockerfile', 'apps/api']
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'contract-agent'
      - '--container=web'
      - '--image=gcr.io/$PROJECT_ID/web'
      - '--port=8080'
      - '--container=api'
      - '--image=gcr.io/$PROJECT_ID/api'
      - '--port=7000'
      - '--set-secrets=DB_PASSWORD=db-password:latest'
