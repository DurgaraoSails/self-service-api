steps:
  - name: 'maven:3.9-eclipse-temurin-21'
    args: ['mvn', '-B', 'package']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/app', '.']
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'app', '--image=gcr.io/$PROJECT_ID/app', '--port=8080']
