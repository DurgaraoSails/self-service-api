steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/web', 'apps/web']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/api', 'apps/api']
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'web-service', '--image=gcr.io/$PROJECT_ID/web', '--port=8080']
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'api-service', '--image=gcr.io/$PROJECT_ID/api', '--port=7000']
