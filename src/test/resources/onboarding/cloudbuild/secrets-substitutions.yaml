substitutions:
  _REGION: us-central1
  _SERVICE: contract-agent
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/app', '.']
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE'
      - '--image=gcr.io/$PROJECT_ID/app'
      - '--region=$_REGION'
      - '--port=8080'
      - '--set-env-vars=API_TOKEN=sk-verylongfakesecretvalue1234567890,LOG_LEVEL=info'
      - '--set-secrets=DB_PASSWORD=db-password-ref:latest'
