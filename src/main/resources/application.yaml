spring:
  # Local-dev-only SMTP secrets (gitignored, generated locally — see secrets/README.md).
  # Absent in prod/CI, so real deploys still rely purely on SMTP_USERNAME/SMTP_PASSWORD env vars.
  config:
    import: optional:file:./secrets/smtp.properties

  application:
    name: self-service-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/selfservice}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

otp:
  hash-secret: ${OTP_HASH_SECRET:local-dev-otp-secret-change-me}
  expiry-minutes: 10
  max-attempts: 5
  max-resends: 3
  max-requests-per-hour: 5

registration-verification:
  ttl-hours: ${REGISTRATION_VERIFICATION_TTL_HOURS:24}

jwt:
  issuer: ${JWT_ISSUER:self-service-api}
  private-key-path: ${JWT_PRIVATE_KEY_PATH:file:./secrets/jwt/private-key.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:file:./secrets/jwt/public-key.pem}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  # POC-scoped tokens (POST /pocs/{slug}/launch). Deliberately far shorter than an access token:
  # this one lives in JavaScript on a POC's own origin, and the portal is the only thing that can
  # refresh it — which is what makes signing out of the portal end POC access within one TTL,
  # with no revocation infrastructure anywhere.
  poc-token-ttl: ${JWT_POC_TOKEN_TTL:15m}

trial:
  length-days: ${TRIAL_LENGTH_DAYS:14}

files:
  # 'gcs' is production. 'local' writes under a directory on this machine instead, so the feature
  # runs with no GCP credentials at all — the same reasoning as pipeline.executor=skip. Never
  # durable in a deploy: Cloud Run's filesystem is memory-backed and per-instance.
  storage: ${FILE_STORAGE:local}
  # gcs only. Its own bucket, not a prefix in the pipeline's — retention and access are this
  # bucket's whole purpose. Blank with storage=gcs fails at startup rather than at first upload.
  bucket: ${FILE_STORAGE_BUCKET:}
  # local only. Blank uses <system temp>/self-service-files.
  local-dir: ${FILE_STORAGE_LOCAL_DIR:}

  # Raised from the 5 MB first specced: 5 MB rejects most *scanned* documents (10-20 MB), which is
  # what a prospect actually uploads to a contract-review demo. Still under a third of Cloud Run's
  # 32 MiB request ceiling — the headroom that lets the multipart spool threshold sit above this
  # limit, so an upload never touches the (memory-backed) filesystem. Changing this means changing
  # the spool threshold and the container's memory together, not on its own.
  max-file-size: ${FILE_MAX_FILE_SIZE:10MB}
  max-files-per-poc: ${FILE_MAX_FILES_PER_POC:20}
  max-bytes-per-user: ${FILE_MAX_BYTES_PER_USER:250MB}

  # Selects from the types ContentTypeValidator has a content signature for. Adding one that has
  # no signature fails startup: skipping validation for it would quietly turn this allowlist back
  # into a claim from the client, which is the thing it exists to replace.
  allowed-content-types:
    - application/pdf
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - application/vnd.openxmlformats-officedocument.presentationml.presentation
    - text/plain
    - text/csv
    - image/png
    - image/jpeg

admin:
  emails: ${ADMIN_EMAILS:}

email-domain-validation:
  timeout-millis: ${EMAIL_DOMAIN_VALIDATION_TIMEOUT_MILLIS:2000}
  retries: ${EMAIL_DOMAIN_VALIDATION_RETRIES:1}

support:
  sales-email: ${SALES_EMAIL:no.reply.sails.poc@gmail.com}

deployment:
  # 'in-process' runs the real pipeline asynchronously in this JVM. 'logging' is a stub that
  # only logs, letting you drive status transitions by hand via POST .../status.
  trigger: ${DEPLOYMENT_TRIGGER:in-process}
  # Unused by the in-process trigger; kept for the (still-wired, still-working) manual status
  # callback and the source-repository/upstream-commit endpoints, none of which this needs.
  webhook-secret: ${DEPLOYMENT_WEBHOOK_SECRET:local-dev-deployment-webhook-secret-change-me}

gcp:
  project-id: ${GCP_PROJECT_ID:sails-agenthub}
  region: ${GCP_REGION:us-central1}
  environment: ${GCP_ENVIRONMENT:dev}

pipeline:
  # 'local' clones/builds/deploys on this machine with your own gcloud credentials — the default,
  # so the pipeline is testable immediately with no GCP IAM setup beyond
  # `gcloud auth application-default login`. 'cloud-build' is what production uses. 'skip' does
  # none of that — every deploy request just gets reported SKIPPED — for anyone running this
  # locally with no GCP account/credentials at all, so triggering a deploy never fails with a
  # `docker`/`gcloud`-not-found error. Put PIPELINE_EXECUTOR=skip in your own
  # application-local.yaml if that's you.
  executor: ${PIPELINE_EXECUTOR:skip}

  # The single source for this token — used by GitHubService (both executors, to create release
  # tags via the GitHub API), the local executor's clone, and as a fallback for cloud-build's
  # clone step. Blank works only for a public repository.
  github-token: ${GITHUB_TOKEN:}

  # cloud-build only. Blank runs the build as Cloud Build's own default service account, which is
  # what you need until self-service-builder holds its intended bindings.
  build-service-account: ${BUILD_SERVICE_ACCOUNT:}
  # cloud-build only. Blank falls back to github-token below (see BuildService for why that's
  # worse — an inline token is stored permanently on the Build resource).
  github-token-secret-id: ${BUILD_GITHUB_TOKEN_SECRET:}

  # Grants self-service-api's own service account run.invoker on the deployed POC — it's the
  # identity that proxies end-user traffic (no separate gateway service in this design). Needs
  # run.services.setIamPolicy, which roles/editor excludes. Off by default so a deploy under
  # Editor doesn't fail on this step; the deploy itself still fully succeeds.
  grant-api-invoker: ${BUILD_GRANT_API_INVOKER:false}
  # Also needs setIamPolicy. Off by default — test a deployed POC with an identity token instead:
  # `gcloud run services proxy <slug> --region <region>`, which works under Editor with no grant.
  allow-unauthenticated: ${BUILD_ALLOW_UNAUTHENTICATED:false}

  # local only. Blank uses the system temp directory.
  workspace-dir: ${PIPELINE_WORKSPACE_DIR:}
  command-timeout: ${PIPELINE_COMMAND_TIMEOUT:20m}
  # cloud-build only.
  build-timeout: ${PIPELINE_BUILD_TIMEOUT:20m}
  build-poll-interval: ${PIPELINE_BUILD_POLL_INTERVAL:10s}

app:
  mail:
    from-address: ${MAIL_FROM_ADDRESS}
    from-name: ${MAIL_FROM_NAME:Self Service}
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      probes:
        enabled: true

server:
  address: 0.0.0.0
  port: ${PORT:8080}

brevo:
  api-key: ${BREVO_API_KEY}
