spring:
  application:
    name: self-service-api

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/selfservice}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

otp:
  hash-secret: ${OTP_HASH_SECRET:local-dev-otp-secret-change-me}
  expiry-minutes: 10
  max-attempts: 5
  max-resends: 3
  max-requests-per-hour: 5

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info