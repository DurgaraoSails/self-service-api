spring:
  application:
    name: self-service-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/selfservice}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info