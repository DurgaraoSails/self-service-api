spring:
  config:
    import: optional:file:./secrets/application-local-secrets.yaml

JWT_PRIVATE_KEY_PATH: file:./secrets/jwt/private-key.pem
JWT_PUBLIC_KEY_PATH: file:./secrets/jwt/public-key.pem

MAIL_FROM_NAME: Sails Self Service
MAIL_FROM_ADDRESS: no.reply.sails.poc@gmail.com

PIPELINE_EXECUTOR: skip
BUILD_SERVICE_ACCOUNT: self-service-builder

# Local development has the Microsoft credentials in the gitignored secrets import above.
MICROSOFT_SSO_ENABLED: true
