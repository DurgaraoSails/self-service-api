openapi: 3.0.3

info:
  title: Self Service API
  description: Self Service application REST API
  version: 1.0.0

servers:
  - url: /api/v1

security:
  - bearerAuth: []

paths:

  /auth/register:
    post:
      summary: Register a new user account and send the first verification code
      operationId: register
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/user.yaml#/RegisterRequest'
      responses:
        '201':
          description: Account created; verification code sent
          content:
            application/json:
              schema:
                $ref: './components/schemas/otp.yaml#/OtpRequestResponse'
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '409':
          $ref: './components/responses.yaml#/Conflict'
        '429':
          $ref: './components/responses.yaml#/TooManyRequests'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /auth/register/verify:
    post:
      summary: Complete registration via the link sent to the user's email
      description: >
        Activates the account and issues an access/refresh token pair, the same as
        /auth/otp/verify — the token is single-use and expires 24 hours after registration.
      operationId: verifyRegistration
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/auth.yaml#/RegistrationVerifyRequest'
      responses:
        '200':
          description: Registration verified; access and refresh token pair issued, with the user's profile
          content:
            application/json:
              schema:
                $ref: './components/schemas/auth.yaml#/LoginResponse'
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /auth/tokens:
    post:
      summary: Issue a token pair for an email (interim login, pending email + OTP verification)
      operationId: issueTokens
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/auth.yaml#/IssueTokenRequest'

      responses:
        '200':
          description: Access and refresh token pair
          content:
            application/json:
              schema:
                $ref: './components/schemas/auth.yaml#/TokenResponse'

        '400':
          $ref: './components/responses.yaml#/BadRequest'

        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /auth/refresh:
    post:
      summary: Exchange a refresh token for a new access/refresh token pair
      operationId: refreshToken
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/auth.yaml#/RefreshTokenRequest'

      responses:
        '200':
          description: New access and refresh token pair
          content:
            application/json:
              schema:
                $ref: './components/schemas/auth.yaml#/TokenResponse'

        '400':
          $ref: './components/responses.yaml#/BadRequest'

        '401':
          $ref: './components/responses.yaml#/Unauthorized'

        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /auth/logout:
    post:
      summary: Revoke a refresh token
      operationId: logout
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/auth.yaml#/LogoutRequest'

      responses:
        '204':
          description: Refresh token revoked (idempotent, always returned even if the token was already invalid)

        '400':
          $ref: './components/responses.yaml#/BadRequest'

        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /users/me:
    get:
      summary: Get current authenticated user
      operationId: getCurrentUser
      tags:
        - User
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: './components/schemas/user.yaml#/UserResponse'

        '401':
          $ref: './components/responses.yaml#/Unauthorized'

        '403':
          $ref: './components/responses.yaml#/Forbidden'

        '500':
          $ref: './components/responses.yaml#/InternalServerError'

    put:
      summary: Update current authenticated user
      operationId: updateCurrentUser
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/user.yaml#/UpdateUserRequest'

      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: './components/schemas/user.yaml#/UserResponse'

        '400':
          $ref: './components/responses.yaml#/BadRequest'

        '401':
          $ref: './components/responses.yaml#/Unauthorized'

        '403':
          $ref: './components/responses.yaml#/Forbidden'

        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /users/me/trial/extension-request:
    post:
      summary: Request an extension of the current user's own trial, with a reason
      description: >
        Records the request (visible to admins via the Customers list and the "needs attention"
        badge/filter) and emails the sales inbox.
      operationId: requestTrialExtension
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/user.yaml#/RequestTrialExtensionRequest'
      responses:
        '204':
          description: Request recorded
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /users:
    get:
      summary: List registered users (admin only), paginated and filterable
      operationId: getUsers
      tags:
        - User
      parameters:
        - name: registeredFrom
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Ignored when needsAttention=true.
        - name: registeredTo
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Ignored when needsAttention=true.
        - name: needsAttention
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, ignores registeredFrom/registeredTo and returns only ACTIVE users whose trial ends within the next day.
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive substring match against first name, last name, company name, or email. Combines with the other filters.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 30

      responses:
        '200':
          description: One page of matching users
          content:
            application/json:
              schema:
                $ref: './components/schemas/user.yaml#/CustomerPageResponse'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /users/trial-alerts/count:
    get:
      summary: Count of users whose trial ends within the next day (admin only)
      operationId: getTrialAlertsCount
      tags:
        - User
      responses:
        '200':
          description: Alert count
          content:
            application/json:
              schema:
                $ref: './components/schemas/user.yaml#/TrialAlertsCountResponse'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /users/{id}/trial/revoke:
    post:
      summary: End a user's trial immediately (admin only)
      operationId: revokeTrial
      tags:
        - User
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trial revoked
          content:
            application/json:
              schema:
                $ref: './components/schemas/user.yaml#/CustomerResponse'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /users/{id}/trial/extend:
    post:
      summary: Extend a user's trial to a new end date, up to 14 days from now (admin only)
      operationId: extendTrial
      tags:
        - User
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/user.yaml#/ExtendTrialRequest'
      responses:
        '200':
          description: Trial extended
          content:
            application/json:
              schema:
                $ref: './components/schemas/user.yaml#/CustomerResponse'
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /support/contact-sales:
    post:
      summary: Notify the sales team that the current user wants to be contacted
      operationId: contactSales
      tags:
        - Support
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/support.yaml#/ContactSalesRequest'

      responses:
        '200':
          description: Sales team notified
          content:
            application/json:
              schema:
                $ref: './components/schemas/support.yaml#/ContactSalesResponse'

        '400':
          $ref: './components/responses.yaml#/BadRequest'

        '401':
          $ref: './components/responses.yaml#/Unauthorized'

        '403':
          $ref: './components/responses.yaml#/Forbidden'

        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /auth/otp/request:
    post:
      summary: Request a one-time login code
      operationId: requestOtp
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/otp.yaml#/OtpRequestRequest'
      responses:
        '200':
          description: OTP request processed
          content:
            application/json:
              schema:
                $ref: './components/schemas/otp.yaml#/OtpRequestResponse'
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '429':
          $ref: './components/responses.yaml#/TooManyRequests'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /auth/otp/resend:
    post:
      summary: Resend the current one-time login code
      operationId: resendOtp
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/otp.yaml#/OtpRequestRequest'
      responses:
        '200':
          description: OTP resent
          content:
            application/json:
              schema:
                $ref: './components/schemas/otp.yaml#/OtpRequestResponse'
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '429':
          $ref: './components/responses.yaml#/TooManyRequests'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /auth/otp/verify:
    post:
      summary: Verify a one-time login code
      operationId: verifyOtp
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/otp.yaml#/OtpVerifyRequest'
      responses:
        '200':
          description: OTP verified; access and refresh token pair issued, with the user's profile
          content:
            application/json:
              schema:
                $ref: './components/schemas/auth.yaml#/LoginResponse'
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '423':
          $ref: './components/responses.yaml#/Locked'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /pocs:
    get:
      summary: List POCs (public summary — no launch/repository links)
      description: >
        Anonymous and non-admin callers always see only active, non-deleted POCs. Authenticated
        admins additionally see hidden POCs, and soft-deleted ones too when includeDeleted=true
        (ignored for non-admins).
      operationId: getPocs
      tags:
        - Poc
      security: []
      parameters:
        - name: includeDeleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Only takes effect for authenticated administrators.
      responses:
        '200':
          description: List of POCs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/schemas/poc.yaml#/PocSummaryResponse'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

    post:
      summary: Create a new POC (admin only)
      operationId: createPoc
      tags:
        - Poc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/poc.yaml#/CreatePocRequest'
      responses:
        '201':
          description: POC created
          content:
            application/json:
              schema:
                $ref: './components/schemas/poc.yaml#/PocResponse'
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '409':
          $ref: './components/responses.yaml#/Conflict'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /pocs/{id}:
    get:
      summary: Get a POC by id
      operationId: getPocById
      tags:
        - Poc
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: POC details
          content:
            application/json:
              schema:
                $ref: './components/schemas/poc.yaml#/PocResponse'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

    put:
      summary: Update a POC (admin only)
      operationId: updatePoc
      tags:
        - Poc
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/poc.yaml#/UpdatePocRequest'
      responses:
        '200':
          description: POC updated
          content:
            application/json:
              schema:
                $ref: './components/schemas/poc.yaml#/PocResponse'
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

    delete:
      summary: Soft-delete a POC (admin only)
      operationId: deletePoc
      tags:
        - Poc
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: POC soft-deleted
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /pocs/{id}/hide:
    post:
      summary: Hide a POC from the regular dashboard listing (admin only)
      operationId: hidePoc
      tags:
        - Poc
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: POC hidden
          content:
            application/json:
              schema:
                $ref: './components/schemas/poc.yaml#/PocResponse'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /pocs/{id}/unhide:
    post:
      summary: Unhide a POC, restoring it to the regular dashboard listing (admin only)
      operationId: unhidePoc
      tags:
        - Poc
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: POC unhidden
          content:
            application/json:
              schema:
                $ref: './components/schemas/poc.yaml#/PocResponse'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /pocs/{id}/restore:
    post:
      summary: Restore a soft-deleted POC (admin only)
      operationId: restorePoc
      tags:
        - Poc
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: POC restored
          content:
            application/json:
              schema:
                $ref: './components/schemas/poc.yaml#/PocResponse'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /pocs/deployments/latest:
    get:
      summary: Latest deployment of every POC, optionally filtered by state (admin only)
      description: >
        One row per POC, carrying only its most recent deployment attempt — the fleet-wide view
        behind the admin's build-status screen. Unlike GET /pocs, this deliberately includes POCs
        that are not live (not_deployed / building / failed), since those are exactly the ones an
        admin needs to see. Pass status=failed for the "what's broken" view. Soft-deleted POCs are
        always excluded.
      operationId: getLatestDeployments
      tags:
        - Poc
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [not_deployed, building, active, failed]
          description: Filter to POCs in this pipeline state. Omit for all POCs.
      responses:
        '200':
          description: Latest deployment per POC, most recently started first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/schemas/poc.yaml#/PocDeploymentSummaryResponse'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /pocs/{slug}/check-updates:
    post:
      summary: Re-fetch the repo's main branch and compare it to what's deployed (admin only)
      operationId: checkPocUpdates
      tags:
        - Poc
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Update-availability result
          content:
            application/json:
              schema:
                $ref: './components/schemas/poc.yaml#/CheckUpdatesResponse'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /pocs/{slug}/deploy-new-version:
    post:
      summary: Tag, build, and deploy a new release of an existing POC (admin only)
      description: >
        Runs asynchronously — returns immediately once the pipeline has been kicked off, well
        before the tag/build/deploy sequence actually finishes. Poll deployments/latest for progress.
      operationId: deployNewPocVersion
      tags:
        - Poc
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: './components/schemas/poc.yaml#/DeployNewVersionRequest'
      responses:
        '202':
          description: Deployment pipeline triggered
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '409':
          $ref: './components/responses.yaml#/Conflict'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /pocs/{slug}/deployments/latest:
    get:
      summary: Most recent deployment attempt for a POC — for the admin progress view (admin only)
      operationId: getLatestPocDeployment
      tags:
        - Poc
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Most recent deployment
          content:
            application/json:
              schema:
                $ref: './components/schemas/poc.yaml#/PocDeploymentResponse'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /activity/heartbeat:
    post:
      summary: Record that the caller is actively using a POC
      description: >
        Sent periodically by the portal while a POC workspace is open. Any authenticated user
        may report their own usage; the user is taken from the bearer token, never the body.
      operationId: recordHeartbeat
      tags:
        - Activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/activity.yaml#/HeartbeatRequest'
      responses:
        '204':
          description: Heartbeat recorded
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /activity/end:
    post:
      summary: Close the caller's open session for a POC immediately
      description: >
        Sent when the portal detects the caller leaving a POC workspace (in-app navigation, tab
        close, or reload), so the session closes right away instead of waiting out the server's
        grace period. A no-op if there's no open session, so it's safe to call more than once
        or after the session has already closed on its own.
      operationId: endSession
      tags:
        - Activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/schemas/activity.yaml#/HeartbeatRequest'
      responses:
        '204':
          description: Session closed, or no open session to close
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /activity/leaderboard/pocs:
    get:
      summary: POCs ranked by total usage time (admin only)
      operationId: getPocLeaderboard
      tags:
        - Activity
      responses:
        '200':
          description: POC usage totals, highest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/schemas/activity.yaml#/PocUsageSummary'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /activity/leaderboard/users:
    get:
      summary: Users ranked by total usage time (admin only)
      operationId: getUserLeaderboard
      tags:
        - Activity
      responses:
        '200':
          description: User usage totals, highest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/schemas/activity.yaml#/UserUsageSummary'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /activity/users/{userId}:
    get:
      summary: One user's activity broken down per POC, with their sessions (admin only)
      operationId: getUserActivity
      tags:
        - Activity
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The user's activity detail
          content:
            application/json:
              schema:
                $ref: './components/schemas/activity.yaml#/UserActivityDetail'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '404':
          $ref: './components/responses.yaml#/NotFound'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /activity/usage/daily:
    get:
      summary: Daily usage totals across all POCs and users, for charting (admin only)
      operationId: getDailyUsage
      tags:
        - Activity
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          description: First day to include, inclusive (UTC).
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Last day to include, inclusive (UTC). Must not be before `from`.
      responses:
        '200':
          description: One point per day in the range, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/schemas/activity.yaml#/DailyUsagePoint'
        '400':
          $ref: './components/responses.yaml#/BadRequest'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

  /activity/active:
    get:
      summary: Sessions currently active across all users, for a live status view (admin only)
      operationId: getActiveSessions
      tags:
        - Activity
      responses:
        '200':
          description: Currently active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/schemas/activity.yaml#/ActiveSessionResponse'
        '401':
          $ref: './components/responses.yaml#/Unauthorized'
        '403':
          $ref: './components/responses.yaml#/Forbidden'
        '500':
          $ref: './components/responses.yaml#/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      $ref: './components/security.yaml#/bearerAuth'