BadRequest:
  description: The request is invalid.
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ErrorResponse'


Unauthorized:
  description: Authentication is required or the provided bearer token is invalid.
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ErrorResponse'


Forbidden:
  description: The authenticated user does not have permission to access the requested resource.
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ErrorResponse'


NotFound:
  description: The requested resource was not found.
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ErrorResponse'


Conflict:
  description: The request conflicts with the current state of the resource.
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ErrorResponse'


InternalServerError:
  description: An unexpected error occurred while processing the request.
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ErrorResponse'


TooManyRequests:
  description: Too many requests — rate limit exceeded.
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ErrorResponse'


Locked:
  description: The resource is locked (e.g. too many failed attempts).
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ErrorResponse'
