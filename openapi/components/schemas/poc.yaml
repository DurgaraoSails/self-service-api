PocSummaryResponse:
  type: object
  description: >
    Public summary of a POC shown on the dashboard catalog. Deliberately excludes the launch
    and repository links, which are only returned to authenticated callers.
  required:
    - id
    - name
    - description
  properties:
    id:
      type: integer
      format: int64
      description: Unique identifier of the POC.
      example: 1

    name:
      type: string
      maxLength: 200
      description: Display name of the POC.
      example: "Contract Agent"

    description:
      type: string
      maxLength: 2000
      description: Short description of what the POC does.
      example: "Review & generate contracts."

    iconUrl:
      type: string
      maxLength: 500
      description: Public URL of the POC's icon image (e.g. hosted in a storage bucket).
      example: "https://cdn.example.com/pocs/contract-agent/icon.svg"


PocResponse:
  description: Full POC details, including the launch and repository links. Requires authentication.
  allOf:
    - $ref: '#/PocSummaryResponse'
    - type: object
      properties:
        appUrl:
          type: string
          maxLength: 500
          description: URL of the deployed POC application.
          example: "https://contract-agent.example.com"

        githubUrl:
          type: string
          maxLength: 500
          description: URL of the POC's source repository.
          example: "https://github.com/example-org/contract-agent"


CreatePocRequest:
  type: object
  description: Request to create a new POC.
  required:
    - name
    - description
  properties:
    name:
      type: string
      maxLength: 200
      example: "Contract Agent"

    description:
      type: string
      maxLength: 2000
      example: "Review & generate contracts."

    iconUrl:
      type: string
      maxLength: 500
      example: "https://cdn.example.com/pocs/contract-agent/icon.svg"

    appUrl:
      type: string
      maxLength: 500
      example: "https://contract-agent.example.com"

    githubUrl:
      type: string
      maxLength: 500
      example: "https://github.com/example-org/contract-agent"


UpdatePocRequest:
  type: object
  description: Request to replace an existing POC's fields.
  required:
    - name
    - description
  properties:
    name:
      type: string
      maxLength: 200
      example: "Contract Agent"

    description:
      type: string
      maxLength: 2000
      example: "Review & generate contracts."

    iconUrl:
      type: string
      maxLength: 500
      example: "https://cdn.example.com/pocs/contract-agent/icon.svg"

    appUrl:
      type: string
      maxLength: 500
      example: "https://contract-agent.example.com"

    githubUrl:
      type: string
      maxLength: 500
      example: "https://github.com/example-org/contract-agent"
