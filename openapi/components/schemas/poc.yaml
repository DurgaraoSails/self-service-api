      maxLength: 100
      example: "Generative AI"

    technologies:
      type: array
      items:
        type: string
      example:
        - "Python"
        - "FastAPI"
        - "PostgreSQL"
        - "LLM"

    containerImage:
      type: string
      maxLength: 500
      example: "registry/company/rag-assistant:1.2.0"

