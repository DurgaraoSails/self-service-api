PocSummaryResponse:
  type: object
  description: >
    Public summary of a POC shown on the dashboard catalog. Deliberately excludes the launch,
    repository, and container-image references, which are only returned to authenticated callers.
  required:
    - id
    - name
    - description
    - status
  properties:
    id:
      type: integer
      format: int64
      description: Unique identifier of the POC.
      example: 1

    name:
      type: string
      maxLength: 200
      description: Display name of the POC.
      example: "Contract Agent"

    description:
      type: string
      maxLength: 2000
      description: Short description of what the POC does.
      example: "Review & generate contracts."

    iconUrl:
      type: string
      maxLength: 500
      description: Public URL of the POC's icon image (e.g. hosted in a storage bucket).
      example: "https://cdn.example.com/pocs/contract-agent/icon.svg"

    activeVersion:
      type: string
      maxLength: 20
      nullable: true
      description: Label of the POC's currently deployed version (e.g. "1.2.4"), or null if it has never been successfully deployed.
      example: "1.2.4"

    latestDeploymentStatus:
      type: string
      enum: [PENDING, BUILDING, DEPLOYING, SUCCEEDED, FAILED]
      nullable: true
      description: Status of the most recent deploy/rollback attempt, or null if one was never triggered.
      example: null

    owner:
      type: string
      maxLength: 200
      description: Team or person that owns the POC.
      example: "AI Team"

    category:
      type: string
      maxLength: 100
      description: Category the POC belongs to.
      example: "Generative AI"

    technologies:
      type: array
      description: Technologies used to build the POC.
      items:
        type: string
      example:
        - "Python"
        - "FastAPI"
        - "PostgreSQL"
        - "LLM"

    demoType:
      type: string
      maxLength: 50
      description: How the demo is presented.
      example: "interactive"

    status:
      type: string
      enum: [ACTIVE, HIDDEN]
      description: >
        Lifecycle status of the POC. HIDDEN removes it from the regular (non-admin) dashboard
        listing without deleting it.
      example: "ACTIVE"

    details:
      type: string
      description: Longer-form description shown on the POC's public details page.
      example: "An AI-guided assistant that walks teams through internal processes step by step."

    guideSteps:
      type: array
      description: Ordered steps shown on the POC's public details page explaining how to use it.
      items:
        type: string
      example:
        - "Click Launch to open the assistant in your session."
        - "Describe the process or task you need help with in plain language."

    deletedAt:
      type: string
      format: date-time
      nullable: true
      description: >
        When this POC was soft-deleted, or null if it isn't deleted. Always null for non-admin
        callers, since deleted POCs are excluded from their results entirely.
      example: null


PocCategoryResponse:
  type: object
  description: A category POCs can be classified under, for the admin add/edit form's dropdown.
  required:
    - id
    - name
  properties:
    id:
      type: integer
      format: int64
      example: 1

    name:
      type: string
      maxLength: 100
      example: "Healthcare"


PocResponse:
  description: >
    Full POC details, including the launch, repository, and container-image references.
    Requires authentication.
  allOf:
    - $ref: '#/PocSummaryResponse'
    - type: object
      properties:
        appUrl:
          type: string
          maxLength: 500
          description: URL of the deployed POC application.
          example: "https://contract-agent.example.com"

        githubUrl:
          type: string
          maxLength: 500
          description: URL of the POC's source repository.
          example: "https://github.com/example-org/contract-agent"

        activeVersionId:
          type: integer
          format: int64
          nullable: true
          description: Id of the POC's currently deployed version (see GET /pocs/{id}/versions), or null if never deployed.
          example: 4

        slug:
          type: string
          description: URL-safe identifier — Cloud Run service name, image path segment, and deployment-pipeline key.
          example: "contract-agent"

        deploymentStatus:
          type: string
          enum: [not_deployed, building, active, failed]
          description: >
            Pipeline lifecycle state. Deliberately separate from `status` (ACTIVE/HIDDEN), which
            is an admin visibility toggle unrelated to whether a deploy actually succeeded.
          example: "active"

        currentReleaseTag:
          type: string
          nullable: true
          description: Version tag of the release currently live, or null if none has gone live yet.
          example: "1.0.0"


CreatePocRequest:
  type: object
  description: >
    Request to create a new POC. Creating a POC always kicks off the deploy pipeline
    (tag main, build, push, deploy) — appUrl and containerImage are populated by the pipeline
    itself once a deployment succeeds, not supplied here.
  required:
    - name
    - description
    - slug
    - githubUrl
  properties:
    name:
      type: string
      maxLength: 200
      example: "Contract Agent"

    description:
      type: string
      maxLength: 2000
      example: "Review & generate contracts."

    slug:
      type: string
      maxLength: 100
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      description: URL-safe identifier, lowercase letters/digits/hyphens only. Used as the Cloud Run service name — must be unique.
      example: "contract-agent"

    iconUrl:
      type: string
      maxLength: 500
      example: "https://cdn.example.com/pocs/contract-agent/icon.svg"

    appUrl:
      type: string
      maxLength: 500
      example: "https://contract-agent.example.com"

    githubUrl:
      type: string
      maxLength: 500
      description: Repository the pipeline clones and tags. Required — this is what triggers the deploy.
      example: "https://github.com/example-org/contract-agent"

    owner:
      type: string
      maxLength: 200
      example: "AI Team"

    category:
      type: string
      maxLength: 100
      example: "Generative AI"

    technologies:
      type: array
      items:
        type: string
      example:
        - "Python"
        - "FastAPI"
        - "PostgreSQL"
        - "LLM"

    demoType:
      type: string
      maxLength: 50
      example: "interactive"

    status:
      type: string
      enum: [ACTIVE, HIDDEN]
      description: Defaults to "ACTIVE" if omitted.
      example: "ACTIVE"

    details:
      type: string
      example: "An AI-guided assistant that walks teams through internal processes step by step."

    guideSteps:
      type: array
      items:
        type: string
      example:
        - "Click Launch to open the assistant in your session."
        - "Describe the process or task you need help with in plain language."


UpdatePocRequest:
  type: object
  description: Request to replace an existing POC's fields.
  required:
    - name
    - description
  properties:
    name:
      type: string
      maxLength: 200
      example: "Contract Agent"

    description:
      type: string
      maxLength: 2000
      example: "Review & generate contracts."

    iconUrl:
      type: string
      maxLength: 500
      example: "https://cdn.example.com/pocs/contract-agent/icon.svg"

    appUrl:
      type: string
      maxLength: 500
      example: "https://contract-agent.example.com"

    githubUrl:
      type: string
      maxLength: 500
      example: "https://github.com/example-org/contract-agent"

    owner:
      type: string
      maxLength: 200
      example: "AI Team"

    category:
      type: string
      maxLength: 100
      example: "Generative AI"

    technologies:
      type: array
      items:
        type: string
      example:
        - "Python"
        - "FastAPI"
        - "PostgreSQL"
        - "LLM"

    demoType:
      type: string
      maxLength: 50
      example: "interactive"

    status:
      type: string
      enum: [ACTIVE, HIDDEN]
      description: Defaults to "ACTIVE" if omitted.
      example: "ACTIVE"

    details:
      type: string
      example: "An AI-guided assistant that walks teams through internal processes step by step."

    guideSteps:
      type: array
      items:
        type: string
      example:
        - "Click Launch to open the assistant in your session."
        - "Describe the process or task you need help with in plain language."


DeployNewVersionRequest:
  type: object
  description: Request to tag, build, and deploy a new release of an existing POC.
  properties:
    bump:
      type: string
      enum: [major, minor, patch]
      default: minor
      description: Defaults to "minor" if omitted.
      example: "minor"


CheckUpdatesResponse:
  type: object
  description: Result of re-fetching the repo's main branch and comparing it to what's deployed.
  required:
    - updateAvailable
  properties:
    updateAvailable:
      type: boolean
      example: true

    latestMainCommitSha:
      type: string
      description: HEAD of main as of this check.
      example: "a1b2c3d4e5f60718293a4b5c6d7e8f9012345678"

    deployedCommitSha:
      type: string
      nullable: true
      description: Commit the currently-active deployment was built from, or null if none is active yet.
      example: "0011223344556677889900112233445566778899"


PocDeploymentResponse:
  type: object
  description: One tag-build-deploy attempt, for the admin-facing progress/status view.
  required:
    - id
    - releaseTag
    - status
    - startedAt
  properties:
    id:
      type: integer
      format: int64
      example: 42

    releaseTag:
      type: string
      example: "1.1.0"

    cloudBuildId:
      type: string
      nullable: true
      description: Null until the build has actually been submitted to Cloud Build.
      example: "302df041-2b75-400f-930d-9225f3d89010"

    imageUri:
      type: string
      nullable: true
      description: Artifact Registry image reference, once the build has pushed it.
      example: "us-central1-docker.pkg.dev/sails-agenthub/poc-images/contract-agent/app:1.1.0"

    status:
      type: string
      enum: [building, active, failed]
      example: "building"

    failureReason:
      type: string
      nullable: true
      description: Set only when status is "failed".
      example: "PermissionDenied: secretmanager.versions.access denied"

    triggeredBy:
      type: string
      nullable: true
      description: User id of the admin who triggered this deployment.

    startedAt:
      type: string
      format: date-time

    finishedAt:
      type: string
      format: date-time
      nullable: true
      description: Null while still building.


PocDeploymentSummaryResponse:
  type: object
  description: >
    One POC together with its most recent deployment attempt — the fleet-wide view an admin
    uses to see what is building, what went live, and what failed. Only the latest attempt per
    POC is included; full per-POC history is not exposed here.
  required:
    - pocId
    - name
    - deploymentStatus
  properties:
    pocId:
      type: integer
      format: int64
      example: 6

    slug:
      type: string
      nullable: true
      description: Null for POCs created before the self-service pipeline existed.
      example: "dummy-poc"

    name:
      type: string
      example: "Dummy POC"

    deploymentStatus:
      type: string
      enum: [not_deployed, building, active, failed]
      description: Authoritative current pipeline state, taken from the POC itself.
      example: "failed"

    currentReleaseTag:
      type: string
      nullable: true
      description: Version currently live, or null if nothing has ever gone live.
      example: "1.2.0"

    latestDeployment:
      description: >
        Most recent deployment attempt, or null for a POC that has never been through the
        pipeline (e.g. a POC seeded before this feature existed).
      nullable: true
      allOf:
        - $ref: '#/PocDeploymentResponse'
