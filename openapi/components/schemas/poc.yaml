PocSummaryResponse:
  type: object
  description: >
    Public summary of a POC shown on the dashboard catalog. Deliberately excludes the launch,
    repository, and container-image references, which are only returned to authenticated callers.
  required:
    - id
    - name
    - description
    - visibilityStatus
  properties:
    id:
      type: integer
      format: int64
      description: Unique identifier of the POC.
      example: 1

    name:
      type: string
      maxLength: 200
      description: Display name of the POC.
      example: "Contract Agent"

    description:
      type: string
      maxLength: 2000
      description: Short description of what the POC does.
      example: "Review & generate contracts."

    iconUrl:
      type: string
      maxLength: 500
      description: Public URL of the POC's icon image (e.g. hosted in a storage bucket).
      example: "https://cdn.example.com/pocs/contract-agent/icon.svg"

    activeVersion:
      type: string
      maxLength: 20
      nullable: true
      description: Label of the POC's currently deployed version (e.g. "1.2.4"), or null if it has never been successfully deployed.
      example: "1.2.4"

    latestDeploymentStatus:
      type: string
      enum: [PENDING, BUILDING, DEPLOYING, SUCCEEDED, FAILED, SKIPPED]
      nullable: true
      description: >
        Status of the most recent deploy/rollback attempt, or null if one was never triggered.
        Not to be confused with visibilityStatus below, which is an unrelated admin toggle —
        this reflects whether the pipeline actually succeeded, not whether the POC is shown.
      example: null

    owner:
      type: string
      maxLength: 200
      description: Team or person that owns the POC.
      example: "AI Team"

    category:
      type: string
      maxLength: 100
      description: Category the POC belongs to.
      example: "Generative AI"

    technologies:
      type: array
      description: Technologies used to build the POC.
      items:
        type: string
      example:
        - "Python"
        - "FastAPI"
        - "PostgreSQL"
        - "LLM"

    demoType:
      type: string
      maxLength: 50
      description: How the demo is presented.
      example: "interactive"

    visibilityStatus:
      type: string
      enum: [ACTIVE, HIDDEN]
      description: >
        Admin-controlled catalog visibility — HIDDEN removes the POC from the regular
        (non-admin) dashboard listing without deleting it. Unrelated to whether the POC's
        pipeline actually succeeded; see latestDeploymentStatus above for that.
      example: "ACTIVE"

    details:
      type: string
      description: Longer-form description shown on the POC's public details page.
      example: "An AI-guided assistant that walks teams through internal processes step by step."

    guideSteps:
      type: array
      description: Ordered steps shown on the POC's public details page explaining how to use it.
      items:
        type: string
      example:
        - "Click Launch to open the assistant in your session."
        - "Describe the process or task you need help with in plain language."

    deletedAt:
      type: string
      format: date-time
      nullable: true
      description: >
        When this POC was soft-deleted, or null if it isn't deleted. Always null for non-admin
        callers, since deleted POCs are excluded from their results entirely.
      example: null


PocCategoryResponse:
  type: object
  description: A category POCs can be classified under, for the admin add/edit form's dropdown.
  required:
    - id
    - name
  properties:
    id:
      type: integer
      format: int64
      example: 1

    name:
      type: string
      maxLength: 100
      example: "Healthcare"


PocResponse:
  description: >
    Full POC details, including the launch, repository, and container-image references.
    Requires authentication.
  allOf:
    - $ref: '#/PocSummaryResponse'
    - type: object
      properties:
        appUrl:
          type: string
          maxLength: 500
          description: URL of the deployed POC application.
          example: "https://contract-agent.example.com"

        githubUrl:
          type: string
          maxLength: 500
          description: URL of the POC's source repository.
          example: "https://github.com/example-org/contract-agent"

        activeVersionId:
          type: integer
          format: int64
          nullable: true
          description: Id of the POC's currently deployed version (see GET /pocs/{id}/versions), or null if never deployed.
          example: 4

        slug:
          type: string
          description: URL-safe identifier — Cloud Run service name, image path segment, and deployment-pipeline key.
          example: "contract-agent"


CreatePocRequest:
  type: object
  description: >
    Request to create a new POC. Creating a POC records metadata only — deploying is a separate,
    explicit action (POST /pocs/{id}/deploy). slug and githubUrl are optional here, but both are
    required before that POC can be deployed.
  required:
    - name
    - description
  properties:
    name:
      type: string
      maxLength: 200
      example: "Contract Agent"

    description:
      type: string
      maxLength: 2000
      example: "Review & generate contracts."

    slug:
      type: string
      maxLength: 100
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      description: URL-safe identifier, lowercase letters/digits/hyphens only. Used as the Cloud Run service name — must be unique.
      example: "contract-agent"

    iconUrl:
      type: string
      maxLength: 500
      example: "https://cdn.example.com/pocs/contract-agent/icon.svg"

    appUrl:
      type: string
      maxLength: 500
      example: "https://contract-agent.example.com"

    githubUrl:
      type: string
      maxLength: 500
      description: Repository the pipeline clones and tags. Required — this is what triggers the deploy.
      example: "https://github.com/example-org/contract-agent"

    owner:
      type: string
      maxLength: 200
      example: "AI Team"

    category:
      type: string
      maxLength: 100
      example: "Generative AI"

    technologies:
      type: array
      items:
        type: string
      example:
        - "Python"
        - "FastAPI"
        - "PostgreSQL"
        - "LLM"

    demoType:
      type: string
      maxLength: 50
      example: "interactive"

    visibilityStatus:
      type: string
      enum: [ACTIVE, HIDDEN]
      description: Defaults to "ACTIVE" if omitted.
      example: "ACTIVE"

    details:
      type: string
      example: "An AI-guided assistant that walks teams through internal processes step by step."

    guideSteps:
      type: array
      items:
        type: string
      example:
        - "Click Launch to open the assistant in your session."
        - "Describe the process or task you need help with in plain language."


UpdatePocRequest:
  type: object
  description: Request to replace an existing POC's fields.
  required:
    - name
    - description
  properties:
    name:
      type: string
      maxLength: 200
      example: "Contract Agent"

    description:
      type: string
      maxLength: 2000
      example: "Review & generate contracts."

    slug:
      type: string
      maxLength: 100
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      description: >
        Only settable while the POC has no slug yet, so a POC created before the deploy pipeline
        existed can be adopted into it. Ignored once assigned — the slug names a live Cloud Run
        service and changing it would orphan the deployment.
      example: "contract-agent"

    iconUrl:
      type: string
      maxLength: 500
      example: "https://cdn.example.com/pocs/contract-agent/icon.svg"

    appUrl:
      type: string
      maxLength: 500
      example: "https://contract-agent.example.com"

    githubUrl:
      type: string
      maxLength: 500
      example: "https://github.com/example-org/contract-agent"

    owner:
      type: string
      maxLength: 200
      example: "AI Team"

    category:
      type: string
      maxLength: 100
      example: "Generative AI"

    technologies:
      type: array
      items:
        type: string
      example:
        - "Python"
        - "FastAPI"
        - "PostgreSQL"
        - "LLM"

    demoType:
      type: string
      maxLength: 50
      example: "interactive"

    visibilityStatus:
      type: string
      enum: [ACTIVE, HIDDEN]
      description: Defaults to "ACTIVE" if omitted.
      example: "ACTIVE"

    details:
      type: string
      example: "An AI-guided assistant that walks teams through internal processes step by step."

    guideSteps:
      type: array
      items:
        type: string
      example:
        - "Click Launch to open the assistant in your session."
        - "Describe the process or task you need help with in plain language."


PocLaunchResponse:
  type: object
  description: >
    Everything the portal needs to open a POC in its iframe. The token is POC-scoped and
    short-lived; the portal is the refresh authority and re-calls this endpoint when it nears
    expiry, so the POC never holds a refresh token of any kind.
  required:
    - token
    - expiresIn
    - launchUrl
    - pocId
    - slug
  properties:
    token:
      type: string
      description: >
        A POC-scoped JWT, audience "poc:<slug>". Carries the user's id, display name and theme,
        and no roles. Delivered to the iframe over postMessage, never in a URL — a token in a URL
        ends up in server logs, Referer headers and browser history.

    expiresIn:
      type: integer
      format: int64
      description: Token lifetime in seconds.
      example: 900

    launchUrl:
      type: string
      description: The POC's deployed application URL, to be framed.
      example: "https://contract-agent-abc123-uc.a.run.app"

    pocId:
      type: integer
      format: int64
      example: 4

    slug:
      type: string
      example: "contract-agent"
