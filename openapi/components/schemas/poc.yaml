PocSummaryResponse:
  type: object
  description: >
    Public summary of a POC shown on the dashboard catalog. Deliberately excludes the launch,
    repository, and container-image references, which are only returned to authenticated callers.
  required:
    - id
    - name
    - description
    - visibilityStatus
    - hasActiveUrl
  properties:
    id:
      type: string
      format: uuid
      description: Unique identifier of the POC.
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    name:
      type: string
      maxLength: 200
      description: Display name of the POC.
      example: "Contract Agent"

    description:
      type: string
      maxLength: 2000
      description: Short description of what the POC does.
      example: "Review & generate contracts."

    iconUrl:
      type: string
      maxLength: 500
      description: Public URL of the POC's icon image (e.g. hosted in a storage bucket).
      example: "https://cdn.example.com/pocs/contract-agent/icon.svg"

    activeVersion:
      type: string
      maxLength: 20
      nullable: true
      description: Label of the POC's currently deployed version (e.g. "1.2.4"), or null if it has never been successfully deployed.
      example: "1.2.4"

    latestDeploymentStatus:
      type: string
      enum: [PENDING, BUILDING, DEPLOYING, SUCCEEDED, FAILED, SKIPPED]
      nullable: true
      description: >
        Status of the most recent deploy/rollback attempt, or null if one was never triggered.
        Not to be confused with visibilityStatus below, which is an unrelated admin toggle —
        this reflects whether the pipeline actually succeeded, not whether the POC is shown.
      example: null

    hasActiveUrl:
      type: boolean
      description: >
        Whether this POC has a live, launchable appUrl right now — true for a SELF-mode POC the
        moment its Cloud Run URL is saved, and for an AUTOMATIC-mode POC once a deploy has actually
        succeeded. The public summary excludes appUrl itself (see this schema's own description),
        so this is the only way an unauthenticated dashboard viewer can tell a POC is launchable —
        checking activeVersion alone used to be that signal, but it stays null forever for SELF
        mode, which never allocates a version.
      example: false

    pocType:
      $ref: '#/PocType'

    owner:
      type: string
      maxLength: 200
      description: Team or person that owns the POC.
      example: "AI Team"

    category:
      type: string
      maxLength: 100
      description: Category the POC belongs to.
      example: "Generative AI"

    technologies:
      type: array
      description: Technologies used to build the POC.
      items:
        type: string
      example:
        - "Python"
        - "FastAPI"
        - "PostgreSQL"
        - "LLM"

    demoType:
      type: string
      maxLength: 50
      description: How the demo is presented.
      example: "interactive"

    visibilityStatus:
      type: string
      enum: [ACTIVE, HIDDEN]
      description: >
        Admin-controlled catalog visibility — HIDDEN removes the POC from the regular
        (non-admin) dashboard listing without deleting it. Unrelated to whether the POC's
        pipeline actually succeeded; see latestDeploymentStatus above for that.
      example: "ACTIVE"

    details:
      type: string
      description: Longer-form description shown on the POC's public details page.
      example: "An AI-guided assistant that walks teams through internal processes step by step."

    guideSteps:
      type: array
      description: Ordered steps shown on the POC's public details page explaining how to use it.
      items:
        type: string
      example:
        - "Click Launch to open the assistant in your session."
        - "Describe the process or task you need help with in plain language."

    deletedAt:
      type: string
      format: date-time
      nullable: true
      description: >
        When this POC was soft-deleted, or null if it isn't deleted. Always null for non-admin
        callers, since deleted POCs are excluded from their results entirely.
      example: null


PocBranchesResponse:
  type: object
  description: >
    The branches of a POC's repository, for the admin form's deploy-branch picker. Read live from
    GitHub on each request - there is nothing stored to go stale, and a branch created a minute ago
    should be selectable.
  required:
    - branches
  properties:
    branches:
      type: array
      description: Branch names, alphabetical, as GitHub returns them.
      items:
        type: string
      example: ["develop", "main", "release/2024"]

    defaultBranch:
      type: string
      nullable: true
      description: >
        The repository's own default branch - what a POC with no deployBranch deploys from. Returned
        so the form can label the empty choice rather than just calling it "default".
      example: "main"

    truncated:
      type: boolean
      description: >
        The repository has more branches than were read (the API caps the read at 500). The form
        keeps manual entry available when this is true, so a branch past the cap is still reachable.
      example: false

PocCategoryResponse:
  type: object
  description: A category POCs can be classified under, for the admin add/edit form's dropdown.
  required:
    - id
    - name
  properties:
    id:
      type: integer
      format: int64
      example: 1

    name:
      type: string
      maxLength: 100
      example: "Healthcare"


PocResponse:
  description: >
    Full POC details, including the launch, repository, and container-image references.
    Requires authentication.
  allOf:
    - $ref: '#/PocSummaryResponse'
    - type: object
      properties:
        appUrl:
          type: string
          maxLength: 500
          description: URL of the deployed POC application.
          example: "https://contract-agent.example.com"

        githubUrl:
          type: string
          maxLength: 500
          description: URL of the POC's source repository.
          example: "https://github.com/example-org/contract-agent"

        deployBranch:
          type: string
          maxLength: 255
          nullable: true
          description: >
            Branch a new version is cut from - its head commit is what gets tagged, built and
            deployed. Null means this repository's own default branch, whatever GitHub reports it
            to be.
          example: "main"

        activeVersionId:
          type: string
          format: uuid
          nullable: true
          description: Id of the POC's currently deployed version (see GET /pocs/{id}/versions), or null if never deployed.
          example: "5b1f2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d"

        slug:
          type: string
          description: URL-safe identifier — Cloud Run service name, image path segment, and deployment-pipeline key.
          example: "contract-agent"

        deploymentMode:
          $ref: '#/DeploymentMode'


DeploymentMode:
  type: string
  enum: [SELF, AUTOMATIC]
  description: >
    How this POC's appUrl gets populated. AUTOMATIC (the default) is the existing build/deploy
    pipeline: githubUrl and slug feed it, and it writes appUrl itself once a build succeeds — appUrl
    is not admin-editable input in this mode. SELF skips the pipeline entirely: an admin who already
    has a running Cloud Run service (deployed by hand, or by anything outside this platform) supplies
    its URL directly as appUrl, and that is used for launch as-is. A POC's mode can be changed later
    (see UpdatePocRequest) — switching to SELF does not touch any existing githubUrl/deployBranch,
    it just stops the pipeline fields from being required and starts requiring appUrl instead.
  example: "AUTOMATIC"


PocType:
  type: string
  enum: [INTERNAL, CLIENT_SPECIFIC]
  description: >
    A general internal tool (INTERNAL, the default — every POC predating this field) versus one
    built for a specific named client (CLIENT_SPECIFIC). Purely a catalog label/filter, alongside
    the existing freeform category — nothing else on the platform branches on it.
  example: "INTERNAL"


CreatePocRequest:
  type: object
  description: >
    Request to create a new POC. Creating a POC records metadata only — deploying is a separate,
    explicit action (POST /pocs/{id}/deploy) — but slug is required at creation all the same,
    since it is how POST /pocs/{slug}/launch addresses the POC regardless of deploymentMode.
    Whether githubUrl or appUrl is the field that actually has to be filled in depends on
    deploymentMode (see DeploymentMode) — enforced once the mode is known, not by this schema's own
    required list, so it is a 400 either way rather than a POC that quietly never goes live.
  required:
    - name
    - description
    - slug
  properties:
    name:
      type: string
      maxLength: 200
      example: "Contract Agent"

    description:
      type: string
      maxLength: 2000
      example: "Review & generate contracts."

    slug:
      type: string
      maxLength: 100
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      description: URL-safe identifier, lowercase letters/digits/hyphens only. Used as the Cloud Run service name — must be unique.
      example: "contract-agent"

    iconUrl:
      type: string
      maxLength: 500
      example: "https://cdn.example.com/pocs/contract-agent/icon.svg"

    appUrl:
      type: string
      maxLength: 500
      description: >
        The deployed POC application's URL. Required input when deploymentMode is SELF — that is
        the only place this value ever comes from in that mode. Ignored as input when deploymentMode
        is AUTOMATIC (or omitted): the pipeline writes it once a build actually succeeds, so sending
        it here has no effect and it is not read back until then.
      example: "https://contract-agent.example.com"

    githubUrl:
      type: string
      maxLength: 500
      description: >
        Repository the pipeline clones and tags — required when deploymentMode is AUTOMATIC (the
        default), since that is what triggers the deploy. Not required, and not used for anything,
        when deploymentMode is SELF.
      example: "https://github.com/example-org/contract-agent"

    deployBranch:
      type: string
      maxLength: 255
      nullable: true
      description: >
        Branch to cut versions from - the branch whose head commit gets tagged, built and deployed.
        Optional: omit it, or send null or an empty string, to follow the repository's own default
        branch. Must be a name git accepts as a ref (no spaces, no "..", none of the characters git
        forbids); anything else is rejected with 400 INVALID_DEPLOY_BRANCH rather than stored and
        discovered later by a failed deployment. Only meaningful when deploymentMode is AUTOMATIC.
      example: "main"

    owner:
      type: string
      maxLength: 200
      example: "AI Team"

    category:
      type: string
      maxLength: 100
      example: "Generative AI"

    technologies:
      type: array
      items:
        type: string
      example:
        - "Python"
        - "FastAPI"
        - "PostgreSQL"
        - "LLM"

    demoType:
      type: string
      maxLength: 50
      example: "interactive"

    visibilityStatus:
      type: string
      enum: [ACTIVE, HIDDEN]
      description: Defaults to "ACTIVE" if omitted.
      example: "ACTIVE"

    details:
      type: string
      example: "An AI-guided assistant that walks teams through internal processes step by step."

    guideSteps:
      type: array
      items:
        type: string
      example:
        - "Click Launch to open the assistant in your session."
        - "Describe the process or task you need help with in plain language."

    deploymentMode:
      $ref: '#/DeploymentMode'

    pocType:
      $ref: '#/PocType'


UpdatePocRequest:
  type: object
  description: >
    Request to replace an existing POC's fields. slug is required for the same reason it is on
    create, and because this endpoint replaces rather than merges. Sending slug for a POC that
    already has one is harmless — it is assigned once and then ignored, since it names a live Cloud
    Run service. Whether githubUrl or appUrl must be non-blank depends on deploymentMode; see
    DeploymentMode and CreatePocRequest.
  required:
    - name
    - description
    - slug
  properties:
    name:
      type: string
      maxLength: 200
      example: "Contract Agent"

    description:
      type: string
      maxLength: 2000
      example: "Review & generate contracts."

    slug:
      type: string
      maxLength: 100
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      description: >
        Only settable while the POC has no slug yet, so a POC created before the deploy pipeline
        existed can be adopted into it. Ignored once assigned — the slug names a live Cloud Run
        service and changing it would orphan the deployment.
      example: "contract-agent"

    iconUrl:
      type: string
      maxLength: 500
      example: "https://cdn.example.com/pocs/contract-agent/icon.svg"

    appUrl:
      type: string
      maxLength: 500
      description: >
        The deployed POC application's URL. Required input when deploymentMode is SELF; ignored as
        input (pipeline-written) when deploymentMode is AUTOMATIC — see CreatePocRequest.appUrl.
      example: "https://contract-agent.example.com"

    githubUrl:
      type: string
      maxLength: 500
      description: >
        Repository the pipeline clones and tags — required when deploymentMode is AUTOMATIC. Not
        required when deploymentMode is SELF — see CreatePocRequest.githubUrl.
      example: "https://github.com/example-org/contract-agent"

    deployBranch:
      type: string
      maxLength: 255
      nullable: true
      description: >
        Branch to cut versions from - the branch whose head commit gets tagged, built and deployed.
        Optional: omit it, or send null or an empty string, to follow the repository's own default
        branch. Must be a name git accepts as a ref (no spaces, no "..", none of the characters git
        forbids); anything else is rejected with 400 INVALID_DEPLOY_BRANCH rather than stored and
        discovered later by a failed deployment. Only meaningful when deploymentMode is AUTOMATIC.
      example: "main"

    owner:
      type: string
      maxLength: 200
      example: "AI Team"

    category:
      type: string
      maxLength: 100
      example: "Generative AI"

    technologies:
      type: array
      items:
        type: string
      example:
        - "Python"
        - "FastAPI"
        - "PostgreSQL"
        - "LLM"

    demoType:
      type: string
      maxLength: 50
      example: "interactive"

    visibilityStatus:
      type: string
      enum: [ACTIVE, HIDDEN]
      description: Defaults to "ACTIVE" if omitted.
      example: "ACTIVE"

    details:
      type: string
      example: "An AI-guided assistant that walks teams through internal processes step by step."

    guideSteps:
      type: array
      items:
        type: string
      example:
        - "Click Launch to open the assistant in your session."
        - "Describe the process or task you need help with in plain language."

    deploymentMode:
      $ref: '#/DeploymentMode'

    pocType:
      $ref: '#/PocType'


PocLaunchResponse:
  type: object
  description: >
    Everything the portal needs to open a POC in its iframe. The token is POC-scoped and
    short-lived; the portal is the refresh authority and re-calls this endpoint when it nears
    expiry, so the POC never holds a refresh token of any kind.
  required:
    - token
    - expiresIn
    - launchUrl
    - pocId
    - slug
  properties:
    token:
      type: string
      description: >
        A POC-scoped JWT, audience "poc:<slug>". Carries the user's id, display name and theme,
        and no roles. Delivered to the iframe over postMessage, never in a URL — a token in a URL
        ends up in server logs, Referer headers and browser history.

    expiresIn:
      type: integer
      format: int64
      description: Token lifetime in seconds.
      example: 900

    launchUrl:
      type: string
      description: The POC's deployed application URL, to be framed.
      example: "https://contract-agent-abc123-uc.a.run.app"

    pocId:
      type: string
      format: uuid
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    slug:
      type: string
      example: "contract-agent"
