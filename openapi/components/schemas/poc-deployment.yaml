PocVersionResponse:
  type: object
  description: One version ever built for a POC. Immutable once containerImage is set.
  required:
    - id
    - pocId
    - versionLabel
    - major
    - minor
    - patch
    - isActive
    - createdAt
  properties:
    id:
      type: integer
      format: int64
      example: 4

    pocId:
      type: integer
      format: int64
      example: 1

    versionLabel:
      type: string
      maxLength: 20
      example: "1.2.4"

    major:
      type: integer
      example: 1

    minor:
      type: integer
      example: 2

    patch:
      type: integer
      example: 4

    containerImage:
      type: string
      maxLength: 500
      nullable: true
      description: Null until the pipeline reports a successful build for this version.
      example: "registry/company/contract-agent:1.2.4"

    isActive:
      type: boolean
      description: True if this is the POC's currently deployed version.
      example: true

    createdAt:
      type: string
      format: date-time


PocDeploymentResponse:
  type: object
  description: One deploy attempt — either building and deploying a new version, or redeploying (rolling back to) an already-built version's image.
  required:
    - id
    - pocId
    - pocVersionId
    - versionLabel
    - kind
    - status
    - startedAt
  properties:
    id:
      type: string
      format: uuid
      example: "b3f4c1e2-1234-4a5b-8c9d-0e1f2a3b4c5d"

    pocId:
      type: integer
      format: int64
      example: 1

    pocVersionId:
      type: integer
      format: int64
      example: 4

    versionLabel:
      type: string
      example: "1.2.4"

    kind:
      $ref: '#/DeploymentKind'

    status:
      $ref: '#/DeploymentStatus'

    logsUrl:
      type: string
      maxLength: 500
      nullable: true
      description: Link to the pipeline's own log viewer. No log text is stored or streamed by self-service-api.
      example: "https://console.cloud.google.com/cloud-build/builds/abc123"

    errorMessage:
      type: string
      maxLength: 2000
      nullable: true
      example: "Build failed: npm install exited with code 1"

    initiatedBy:
      type: string
      nullable: true
      description: Id of the admin who triggered this deployment.
      example: "01JABC123XYZ"

    startedAt:
      type: string
      format: date-time

    completedAt:
      type: string
      format: date-time
      nullable: true


DeploymentKind:
  type: string
  enum: [BUILD_AND_DEPLOY, REDEPLOY]
  description: BUILD_AND_DEPLOY builds a new version from source; REDEPLOY redeploys an already-built version's image (rollback).
  example: BUILD_AND_DEPLOY


DeploymentStatus:
  type: string
  enum: [PENDING, BUILDING, DEPLOYING, SUCCEEDED, FAILED]
  description: PENDING is set by self-service-api itself when the deployment is created; the pipeline reports every other transition via the status callback.
  example: PENDING


ReportDeploymentStatusRequest:
  type: object
  description: Body of the pipeline's status callback (POST /pocs/deployments/{deploymentId}/status).
  required:
    - status
  properties:
    status:
      type: string
      enum: [BUILDING, DEPLOYING, SUCCEEDED, FAILED]
      description: PENDING is never reported by the pipeline — only these four transitions.

    containerImage:
      type: string
      maxLength: 500
      description: >
        Required when status=SUCCEEDED and this deployment's kind is BUILD_AND_DEPLOY (ignored for
        REDEPLOY, where the image is already known).
      example: "registry/company/contract-agent:1.2.4"

    logsUrl:
      type: string
      maxLength: 500
      example: "https://console.cloud.google.com/cloud-build/builds/abc123"

    errorMessage:
      type: string
      maxLength: 2000
      description: Required when status=FAILED.
      example: "Build failed: npm install exited with code 1"
