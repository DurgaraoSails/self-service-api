PocVersionResponse:
  type: object
  description: One version ever built for a POC. Immutable once containerImage is set.
  required:
    - id
    - pocId
    - versionLabel
    - major
    - minor
    - patch
    - isActive
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      example: "5b1f2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d"

    pocId:
      type: string
      format: uuid
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    versionLabel:
      type: string
      maxLength: 20
      example: "1.2.4"

    major:
      type: integer
      example: 1

    minor:
      type: integer
      example: 2

    patch:
      type: integer
      example: 4

    containerImage:
      type: string
      maxLength: 500
      nullable: true
      description: Null until the pipeline reports a successful build for this version.
      example: "registry/company/contract-agent:1.2.4"

    isActive:
      type: boolean
      description: True if this is the POC's currently deployed version.
      example: true

    createdAt:
      type: string
      format: date-time

    containers:
      type: array
      nullable: true
      description: >
        Every container this version's manifest declared, as actually built. Empty for a version
        built before manifest support existed, or whose repo simply had no poc.yaml — in that case
        `containerImage` above (the single, pre-manifest field) still carries its image.
      items:
        $ref: '#/PocVersionContainerResponse'


PocVersionContainerResponse:
  type: object
  description: One container a version actually built, as declared by the manifest it was built with.
  required:
    - name
    - role
  properties:
    name:
      type: string
      example: "api"

    role:
      $ref: '#/ManifestContainerRole'

    containerImage:
      type: string
      maxLength: 500
      nullable: true
      example: "registry/company/contract-agent/api:1.2.4"

    port:
      type: integer
      nullable: true
      description: Set for a sidecar; null for the ingress container, which binds Cloud Run's own $PORT.
      example: 9000


ManifestContainerRole:
  type: string
  enum: [INGRESS, SIDECAR]
  description: >
    Exactly one container in a manifest is INGRESS (receives Cloud Run's $PORT and the service's
    public entry point); any others are SIDECAR (reachable only from the ingress container).
  example: INGRESS


PocDeploymentResponse:
  type: object
  description: One deploy attempt — either building and deploying a new version, or redeploying (rolling back to) an already-built version's image.
  required:
    - id
    - pocId
    - pocVersionId
    - versionLabel
    - kind
    - status
    - startedAt
  properties:
    id:
      type: string
      format: uuid
      example: "b3f4c1e2-1234-4a5b-8c9d-0e1f2a3b4c5d"

    pocId:
      type: string
      format: uuid
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    pocVersionId:
      type: string
      format: uuid
      example: "5b1f2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d"

    versionLabel:
      type: string
      example: "1.2.4"

    kind:
      $ref: '#/DeploymentKind'

    status:
      $ref: '#/DeploymentStatus'

    logsUrl:
      type: string
      maxLength: 500
      nullable: true
      description: Link to the pipeline's own log viewer. No log text is stored or streamed by self-service-api.
      example: "https://console.cloud.google.com/cloud-build/builds/abc123"

    errorMessage:
      type: string
      maxLength: 2000
      nullable: true
      example: "Build failed: npm install exited with code 1"

    initiatedBy:
      type: string
      nullable: true
      description: Id of the admin who triggered this deployment.
      example: "01JABC123XYZ"

    startedAt:
      type: string
      format: date-time

    completedAt:
      type: string
      format: date-time
      nullable: true

    containers:
      type: array
      nullable: true
      description: >
        A static snapshot of every container this deployment's manifest declares, and each one's
        build/deploy state — not live per-container progress (a single Cloud Build job reports one
        terminal status for the whole build and one for the whole deploy, so every container's
        state moves together at each checkpoint). Absent for a deployment that never resolved a
        manifest (pipeline.executor=skip) or that failed before doing so.
      items:
        $ref: '#/PocDeploymentContainerStatus'


PocDeploymentContainerStatus:
  type: object
  description: One container's build/deploy state as of this deployment's last reported transition.
  required:
    - name
    - role
    - state
  properties:
    name:
      type: string
      example: "api"

    role:
      $ref: '#/ManifestContainerRole'

    state:
      type: string
      enum: [PENDING, BUILT, DEPLOYED]
      description: PENDING until the build step returns, BUILT until the deploy step returns, DEPLOYED once the service is live.
      example: BUILT

    containerImage:
      type: string
      maxLength: 500
      nullable: true
      example: "registry/company/contract-agent/api:1.2.4"

    port:
      type: integer
      nullable: true
      example: 9000


DeploymentKind:
  type: string
  enum: [BUILD_AND_DEPLOY, REDEPLOY]
  description: BUILD_AND_DEPLOY builds a new version from source; REDEPLOY redeploys an already-built version's image (rollback).
  example: BUILD_AND_DEPLOY


DeploymentStatus:
  type: string
  enum: [PENDING, BUILDING, DEPLOYING, SUCCEEDED, FAILED, SKIPPED]
  description: >
    PENDING is set by self-service-api itself when the deployment is created. SKIPPED means the
    pipeline was intentionally not run (deployment.trigger=skip — no build/deploy attempted, e.g.
    for local development with no GCP credentials configured). Every other transition, including
    SKIPPED, is reported via the status callback.
  example: PENDING


ReportDeploymentStatusRequest:
  type: object
  description: Body of the pipeline's status callback (POST /pocs/deployments/{deploymentId}/status).
  required:
    - status
  properties:
    status:
      type: string
      enum: [BUILDING, DEPLOYING, SUCCEEDED, FAILED, SKIPPED]
      description: PENDING is never reported by the pipeline — only these transitions.

    containerImage:
      type: string
      maxLength: 500
      description: >
        Required when status=SUCCEEDED and this deployment's kind is BUILD_AND_DEPLOY (ignored for
        REDEPLOY, where the image is already known).
      example: "registry/company/contract-agent:1.2.4"

    commitSha:
      type: string
      description: >
        The commit this version was built from. Sent with status=SUCCEEDED for a BUILD_AND_DEPLOY
        (ignored for REDEPLOY, which rebuilds nothing). Recorded against the version so that
        "is main ahead of what's deployed?" can be answered without calling GitHub.
      example: "a1b2c3d4e5f60718293a4b5c6d7e8f9012345678"

    hostedUrl:
      type: string
      maxLength: 500
      description: >
        Required when status=SUCCEEDED, for either kind — a deployment is only ever reported
        successful once the service actually has a reachable URL. Written to the POC's own appUrl
        in the same transaction that marks this version active, so "active" can never mean
        "active, but with nowhere to reach it".
      example: "https://contract-agent-abc123-uc.a.run.app"

    logsUrl:
      type: string
      maxLength: 500
      example: "https://console.cloud.google.com/cloud-build/builds/abc123"

    errorMessage:
      type: string
      maxLength: 2000
      description: Required when status=FAILED.
      example: "Build failed: npm install exited with code 1"


PocSourceRepositoryResponse:
  type: object
  description: >
    A POC whose repository the pipeline should poll for new commits. Returned to the deploy
    pipeline only — self-service-api holds no GitHub credential and never reads a repository
    itself.
  required:
    - pocId
    - githubUrl
  properties:
    pocId:
      type: string
      format: uuid
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    slug:
      type: string
      nullable: true
      description: Present for POCs onboarded through the self-service flow; null for older ones.
      example: "contract-agent"

    githubUrl:
      type: string
      example: "https://github.com/example-org/contract-agent"


UpstreamCommit:
  type: object
  description: One POC's current main-branch HEAD, as observed by the pipeline.
  required:
    - pocId
    - commitSha
  properties:
    pocId:
      type: string
      format: uuid
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    commitSha:
      type: string
      description: Full 40-character commit SHA at the head of the repository's default branch.
      example: "a1b2c3d4e5f60718293a4b5c6d7e8f9012345678"


ReportUpstreamCommitsRequest:
  type: object
  description: >
    Batch report of every POC's current upstream HEAD. Sent by the pipeline once per run, so
    that "is there an update available?" can be answered from stored state without a GitHub
    call at read time.
  required:
    - commits
  properties:
    commits:
      type: array
      items:
        $ref: '#/UpstreamCommit'


PocManifestPreviewResponse:
  type: object
  description: >
    What a new build would deploy right now, resolved the same way an actual build would (reads
    and validates the POC's current poc.yaml, or the single-container default if it has none) but
    without creating a deployment — lets the admin see this, or a validation error, before
    triggering a real build.
  required:
    - containers
  properties:
    containers:
      type: array
      items:
        $ref: '#/PocManifestPreviewContainer'


PocManifestPreviewContainer:
  type: object
  required:
    - name
    - role
  properties:
    name:
      type: string
      example: "api"

    role:
      $ref: '#/ManifestContainerRole'

    port:
      type: integer
      nullable: true
      example: 9000
