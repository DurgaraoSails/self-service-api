PocVersionResponse:
  type: object
  description: One version ever built for a POC. Immutable once containerImage is set.
  required:
    - id
    - pocId
    - versionLabel
    - major
    - minor
    - patch
    - isActive
    - createdAt
  properties:
    id:
      type: integer
      format: int64
      example: 4

    pocId:
      type: integer
      format: int64
      example: 1

    versionLabel:
      type: string
      maxLength: 20
      example: "1.2.4"

    major:
      type: integer
      example: 1

    minor:
      type: integer
      example: 2

    patch:
      type: integer
      example: 4

    containerImage:
      type: string
      maxLength: 500
      nullable: true
      description: Null until the pipeline reports a successful build for this version.
      example: "registry/company/contract-agent:1.2.4"

    isActive:
      type: boolean
      description: True if this is the POC's currently deployed version.
      example: true

    createdAt:
      type: string
      format: date-time


PocDeploymentResponse:
  type: object
  description: One deploy attempt — either building and deploying a new version, or redeploying (rolling back to) an already-built version's image.
  required:
    - id
    - pocId
    - pocVersionId
    - versionLabel
    - kind
    - status
    - startedAt
  properties:
    id:
      type: string
      format: uuid
      example: "b3f4c1e2-1234-4a5b-8c9d-0e1f2a3b4c5d"

    pocId:
      type: integer
      format: int64
      example: 1

    pocVersionId:
      type: integer
      format: int64
      example: 4

    versionLabel:
      type: string
      example: "1.2.4"

    kind:
      $ref: '#/DeploymentKind'

    status:
      $ref: '#/DeploymentStatus'

    logsUrl:
      type: string
      maxLength: 500
      nullable: true
      description: Link to the pipeline's own log viewer. No log text is stored or streamed by self-service-api.
      example: "https://console.cloud.google.com/cloud-build/builds/abc123"

    errorMessage:
      type: string
      maxLength: 2000
      nullable: true
      example: "Build failed: npm install exited with code 1"

    initiatedBy:
      type: string
      nullable: true
      description: Id of the admin who triggered this deployment.
      example: "01JABC123XYZ"

    startedAt:
      type: string
      format: date-time

    completedAt:
      type: string
      format: date-time
      nullable: true


DeploymentKind:
  type: string
  enum: [BUILD_AND_DEPLOY, REDEPLOY]
  description: BUILD_AND_DEPLOY builds a new version from source; REDEPLOY redeploys an already-built version's image (rollback).
  example: BUILD_AND_DEPLOY


DeploymentStatus:
  type: string
  enum: [PENDING, BUILDING, DEPLOYING, SUCCEEDED, FAILED, SKIPPED]
  description: >
    PENDING is set by self-service-api itself when the deployment is created. SKIPPED means the
    pipeline was intentionally not run (deployment.trigger=skip — no build/deploy attempted, e.g.
    for local development with no GCP credentials configured). Every other transition, including
    SKIPPED, is reported via the status callback.
  example: PENDING


ReportDeploymentStatusRequest:
  type: object
  description: Body of the pipeline's status callback (POST /pocs/deployments/{deploymentId}/status).
  required:
    - status
  properties:
    status:
      type: string
      enum: [BUILDING, DEPLOYING, SUCCEEDED, FAILED, SKIPPED]
      description: PENDING is never reported by the pipeline — only these transitions.

    containerImage:
      type: string
      maxLength: 500
      description: >
        Required when status=SUCCEEDED and this deployment's kind is BUILD_AND_DEPLOY (ignored for
        REDEPLOY, where the image is already known).
      example: "registry/company/contract-agent:1.2.4"

    commitSha:
      type: string
      description: >
        The commit this version was built from. Sent with status=SUCCEEDED for a BUILD_AND_DEPLOY
        (ignored for REDEPLOY, which rebuilds nothing). Recorded against the version so that
        "is main ahead of what's deployed?" can be answered without calling GitHub.
      example: "a1b2c3d4e5f60718293a4b5c6d7e8f9012345678"

    hostedUrl:
      type: string
      maxLength: 500
      description: >
        Required when status=SUCCEEDED, for either kind — a deployment is only ever reported
        successful once the service actually has a reachable URL. Written to the POC's own appUrl
        in the same transaction that marks this version active, so "active" can never mean
        "active, but with nowhere to reach it".
      example: "https://contract-agent-abc123-uc.a.run.app"

    logsUrl:
      type: string
      maxLength: 500
      example: "https://console.cloud.google.com/cloud-build/builds/abc123"

    errorMessage:
      type: string
      maxLength: 2000
      description: Required when status=FAILED.
      example: "Build failed: npm install exited with code 1"


PocSourceRepositoryResponse:
  type: object
  description: >
    A POC whose repository the pipeline should poll for new commits. Returned to the deploy
    pipeline only — self-service-api holds no GitHub credential and never reads a repository
    itself.
  required:
    - pocId
    - githubUrl
  properties:
    pocId:
      type: integer
      format: int64
      example: 1

    slug:
      type: string
      nullable: true
      description: Present for POCs onboarded through the self-service flow; null for older ones.
      example: "contract-agent"

    githubUrl:
      type: string
      example: "https://github.com/example-org/contract-agent"


UpstreamCommit:
  type: object
  description: One POC's current main-branch HEAD, as observed by the pipeline.
  required:
    - pocId
    - commitSha
  properties:
    pocId:
      type: integer
      format: int64
      example: 1

    commitSha:
      type: string
      description: Full 40-character commit SHA at the head of the repository's default branch.
      example: "a1b2c3d4e5f60718293a4b5c6d7e8f9012345678"


ReportUpstreamCommitsRequest:
  type: object
  description: >
    Batch report of every POC's current upstream HEAD. Sent by the pipeline once per run, so
    that "is there an update available?" can be answered from stored state without a GitHub
    call at read time.
  required:
    - commits
  properties:
    commits:
      type: array
      items:
        $ref: '#/UpstreamCommit'
