PocVersionResponse:
  type: object
  description: >
    One version ever built for a POC. Immutable once containerImage is set. The identity is
    versionLabel — a git tag name, either derived by the platform (e.g. "1.2.4") or picked by an
    admin from the repository's own existing tags (e.g. "v2.3.0", "release-2024"). See
    docs/specs/poc-tag-driven-deployment.md.
  required:
    - id
    - pocId
    - versionLabel
    - isActive
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      example: "5b1f2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d"

    pocId:
      type: string
      format: uuid
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    versionLabel:
      type: string
      maxLength: 255
      example: "1.2.4"

    major:
      type: integer
      nullable: true
      description: Populated only when versionLabel parses as semver; used only for ordering.
      example: 1

    minor:
      type: integer
      nullable: true
      example: 2

    patch:
      type: integer
      nullable: true
      example: 4

    containerImage:
      type: string
      maxLength: 500
      nullable: true
      description: Null until the pipeline reports a successful build for this version.
      example: "registry/company/contract-agent:1.2.4"

    isActive:
      type: boolean
      description: True if this is the POC's currently deployed version.
      example: true

    imageAvailable:
      type: boolean
      nullable: true
      description: >
        Whether containerImage still resolves in Artifact Registry, as of the last repository
        refresh. Null means never checked (e.g. no containerImage yet). Used to grey out a
        rollback that would fail inside Cloud Build with an obscure "image not found".

    createdAt:
      type: string
      format: date-time

    containers:
      type: array
      nullable: true
      description: >
        Every container this version's manifest declared, as actually built. Empty for a version
        built before manifest support existed, or whose repo simply had no poc.yaml — in that case
        `containerImage` above (the single, pre-manifest field) still carries its image.
      items:
        $ref: '#/PocVersionContainerResponse'


PocVersionContainerResponse:
  type: object
  description: One container a version actually built, as declared by the manifest it was built with.
  required:
    - name
    - role
  properties:
    name:
      type: string
      example: "api"

    role:
      $ref: '#/ManifestContainerRole'

    containerImage:
      type: string
      maxLength: 500
      nullable: true
      example: "registry/company/contract-agent/api:1.2.4"

    port:
      type: integer
      nullable: true
      description: Set for a sidecar; null for the ingress container, which binds Cloud Run's own $PORT.
      example: 9000


ManifestContainerRole:
  type: string
  enum: [INGRESS, SIDECAR]
  description: >
    Exactly one container in a manifest is INGRESS (receives Cloud Run's $PORT and the service's
    public entry point); any others are SIDECAR (reachable only from the ingress container).
  example: INGRESS


PocDeploymentResponse:
  type: object
  description: One deploy attempt — either building and deploying a new version, or redeploying (rolling back to) an already-built version's image.
  required:
    - id
    - pocId
    - pocVersionId
    - versionLabel
    - kind
    - status
    - startedAt
  properties:
    id:
      type: string
      format: uuid
      example: "b3f4c1e2-1234-4a5b-8c9d-0e1f2a3b4c5d"

    pocId:
      type: string
      format: uuid
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    pocVersionId:
      type: string
      format: uuid
      example: "5b1f2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d"

    versionLabel:
      type: string
      example: "1.2.4"

    kind:
      $ref: '#/DeploymentKind'

    status:
      $ref: '#/DeploymentStatus'

    logsUrl:
      type: string
      maxLength: 500
      nullable: true
      description: Link to the pipeline's own log viewer. No log text is stored or streamed by self-service-api.
      example: "https://console.cloud.google.com/cloud-build/builds/abc123"

    errorMessage:
      type: string
      maxLength: 2000
      nullable: true
      example: "Build failed: npm install exited with code 1"

    initiatedBy:
      type: string
      nullable: true
      description: Id of the admin who triggered this deployment.
      example: "01JABC123XYZ"

    startedAt:
      type: string
      format: date-time

    completedAt:
      type: string
      format: date-time
      nullable: true

    containers:
      type: array
      nullable: true
      description: >
        A static snapshot of every container this deployment's manifest declares, and each one's
        build/deploy state — not live per-container progress (a single Cloud Build job reports one
        terminal status for the whole build and one for the whole deploy, so every container's
        state moves together at each checkpoint). Absent for a deployment that never resolved a
        manifest (pipeline.executor=skip) or that failed before doing so.
      items:
        $ref: '#/PocDeploymentContainerStatus'


PocDeploymentContainerStatus:
  type: object
  description: One container's build/deploy state as of this deployment's last reported transition.
  required:
    - name
    - role
    - state
  properties:
    name:
      type: string
      example: "api"

    role:
      $ref: '#/ManifestContainerRole'

    state:
      type: string
      enum: [PENDING, BUILT, DEPLOYED]
      description: PENDING until the build step returns, BUILT until the deploy step returns, DEPLOYED once the service is live.
      example: BUILT

    containerImage:
      type: string
      maxLength: 500
      nullable: true
      example: "registry/company/contract-agent/api:1.2.4"

    port:
      type: integer
      nullable: true
      example: 9000


DeploymentKind:
  type: string
  enum: [BUILD_AND_DEPLOY, REDEPLOY]
  description: BUILD_AND_DEPLOY builds a new version from source; REDEPLOY redeploys an already-built version's image (rollback).
  example: BUILD_AND_DEPLOY


DeploymentStatus:
  type: string
  enum: [PENDING, BUILDING, DEPLOYING, SUCCEEDED, FAILED, SKIPPED]
  description: >
    PENDING is set by self-service-api itself when the deployment is created. SKIPPED means the
    pipeline was intentionally not run (deployment.trigger=skip — no build/deploy attempted, e.g.
    for local development with no GCP credentials configured). Every other transition, including
    SKIPPED, is reported via the status callback.
  example: PENDING


ReportDeploymentStatusRequest:
  type: object
  description: Body of the pipeline's status callback (POST /pocs/deployments/{deploymentId}/status).
  required:
    - status
  properties:
    status:
      type: string
      enum: [BUILDING, DEPLOYING, SUCCEEDED, FAILED, SKIPPED]
      description: PENDING is never reported by the pipeline — only these transitions.

    containerImage:
      type: string
      maxLength: 500
      description: >
        Required when status=SUCCEEDED and this deployment's kind is BUILD_AND_DEPLOY (ignored for
        REDEPLOY, where the image is already known).
      example: "registry/company/contract-agent:1.2.4"

    commitSha:
      type: string
      description: >
        The commit this version was built from. Sent with status=SUCCEEDED for a BUILD_AND_DEPLOY
        (ignored for REDEPLOY, which rebuilds nothing). Recorded against the version so that
        "is main ahead of what's deployed?" can be answered without calling GitHub.
      example: "a1b2c3d4e5f60718293a4b5c6d7e8f9012345678"

    hostedUrl:
      type: string
      maxLength: 500
      description: >
        Required when status=SUCCEEDED, for either kind — a deployment is only ever reported
        successful once the service actually has a reachable URL. Written to the POC's own appUrl
        in the same transaction that marks this version active, so "active" can never mean
        "active, but with nowhere to reach it".
      example: "https://contract-agent-abc123-uc.a.run.app"

    logsUrl:
      type: string
      maxLength: 500
      example: "https://console.cloud.google.com/cloud-build/builds/abc123"

    errorMessage:
      type: string
      maxLength: 2000
      description: Required when status=FAILED.
      example: "Build failed: npm install exited with code 1"


PocSourceRepositoryResponse:
  type: object
  description: >
    A POC whose repository the pipeline should poll for new commits. Returned to the deploy
    pipeline only — self-service-api holds no GitHub credential and never reads a repository
    itself.
  required:
    - pocId
    - githubUrl
  properties:
    pocId:
      type: string
      format: uuid
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    slug:
      type: string
      nullable: true
      description: Present for POCs onboarded through the self-service flow; null for older ones.
      example: "contract-agent"

    githubUrl:
      type: string
      example: "https://github.com/example-org/contract-agent"


UpstreamCommit:
  type: object
  description: One POC's current main-branch HEAD, as observed by the pipeline.
  required:
    - pocId
    - commitSha
  properties:
    pocId:
      type: string
      format: uuid
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    commitSha:
      type: string
      description: Full 40-character commit SHA at the head of the repository's default branch.
      example: "a1b2c3d4e5f60718293a4b5c6d7e8f9012345678"


ReportUpstreamCommitsRequest:
  type: object
  description: >
    Batch report of every POC's current upstream HEAD. Sent by the pipeline once per run, so
    that "is there an update available?" can be answered from stored state without a GitHub
    call at read time.
  required:
    - commits
  properties:
    commits:
      type: array
      items:
        $ref: '#/UpstreamCommit'


PocManifestPreviewResponse:
  type: object
  description: >
    What a new build would deploy right now, resolved the same way an actual build would (reads
    and validates the POC's current poc.yaml, or the single-container default if it has none) but
    without creating a deployment — lets the admin see this, or a validation error, before
    triggering a real build.
  required:
    - containers
  properties:
    containers:
      type: array
      items:
        $ref: '#/PocManifestPreviewContainer'


DeployNewVersionRequest:
  type: object
  description: >
    Optional body for POST /pocs/{id}/deploy. Omitted or with tag absent: the platform derives the
    next tag name from the repository's own tags and creates it — today's existing behaviour. With
    tag set: deploys that already-existing tag directly, creating nothing and requiring only read
    access — see docs/specs/poc-tag-driven-deployment.md, "Deploying an existing tag must not
    require push access."
  properties:
    tag:
      type: string
      nullable: true
      description: An existing tag name from GET /pocs/{id}/deployment-overview's tags list.
      example: "v2.3.0"


PocRepoStatusResponse:
  type: object
  description: >
    A POC's repository state as of the last explicit refresh — never fetched from GitHub on this
    response's own request. Absent entirely if no refresh has ever completed (e.g. immediately
    after creating a POC, before the async post-create refresh finishes).
  required:
    - canCreateTags
  properties:
    defaultBranch:
      type: string
      nullable: true
    deployBranch:
      type: string
      nullable: true
      description: The branch actually used, after this POC's own deployBranch and pipeline.deploy-branch are applied.
    headCommitSha:
      type: string
      nullable: true
    canCreateTags:
      type: boolean
      nullable: true
      description: >
        A cached UI hint only, never an enforcement point — the pipeline re-checks push access at
        deploy time. Null means this has never successfully been determined.
    archived:
      type: boolean
      nullable: true
    visible:
      type: boolean
      nullable: true
      description: False covers both "not found" and a private repository the configured token cannot see.
    refreshedAt:
      type: string
      format: date-time
      nullable: true
    refreshError:
      type: string
      nullable: true
      description: Null on success. Set instead of clearing the rest of this object, so a failed refresh is distinguishable from a repository with no tags.


PocRepoTagResponse:
  type: object
  required:
    - tagName
    - isCurrent
    - inRepository
  properties:
    tagName:
      type: string
      example: "1.0.7"
    commitSha:
      type: string
      nullable: true
      description: >
        Null only for a version that was created but never recorded a commit — i.e. one whose build
        never reported success. Always set for a tag read from the repository.
      example: "a3f9c2b1e4d5f6a7b8c9d0e1f2a3b4c5d6e7f8a9"
    isCurrent:
      type: boolean
      description: This tag's commit equals the deploy branch's head at the last refresh.
    inRepository:
      type: boolean
      description: >
        True for a tag read from the repository at the last refresh; false for one present only
        because this POC has a version for it — the tag has since been deleted from GitHub, or has
        fallen outside the few most recent that are stored. Such a version is still deployable from
        its existing image, but cannot be rebuilt, and the UI marks it as such.


PocDeploymentOverviewResponse:
  type: object
  description: >
    Everything the Deployment tab renders, in one round trip off the database with no GitHub call —
    replaces separately fetching the POC, its versions, its deployments and a manifest preview.
    See docs/specs/poc-tag-driven-deployment.md, "API Surface."
  required:
    - githubUrl
    - tags
    - versions
    - deployments
  properties:
    githubUrl:
      type: string
      nullable: true
    slug:
      type: string
      nullable: true
    repoStatus:
      $ref: '#/PocRepoStatusResponse'
    tags:
      type: array
      description: The union of the repository's own recent tags and every tag this POC has a built or attempted version for, deduped by name.
      items:
        $ref: '#/PocRepoTagResponse'
    versions:
      type: array
      items:
        $ref: '#/PocVersionResponse'
    deployments:
      type: array
      items:
        $ref: '#/PocDeploymentResponse'


PocManifestPreviewContainer:
  type: object
  required:
    - name
    - role
  properties:
    name:
      type: string
      example: "api"

    role:
      $ref: '#/ManifestContainerRole'

    port:
      type: integer
      nullable: true
      example: 9000
