UserResponse:
  type: object
  description: Authenticated application user.
  required:
    - id
    - email
    - firstName
    - lastName
    - status
    - theme
  properties:
    id:
      type: string
      description: Unique identifier of the application user.
      example: "01JABC123XYZ"

    email:
      type: string
      format: email
      description: Email address associated with the authenticated identity.
      example: "user@example.com"

    firstName:
      type: string
      maxLength: 100
      description: First name of the user, as given at registration.
      example: "Jane"

    lastName:
      type: string
      maxLength: 100
      description: Last name of the user, as given at registration.
      example: "Doe"

    displayName:
      type: string
      maxLength: 100
      description: Display name of the user.
      example: "John Doe"

    status:
      $ref: '#/UserStatus'

    roles:
      type: array
      description: Roles assigned to the user.
      items:
        type: string
      example:
        - USER

    trialStartDate:
      type: string
      format: date-time
      description: When the account's trial period started, in UTC.
      example: "2026-08-20T10:30:00Z"

    trialEndDate:
      type: string
      format: date-time
      description: When the account's trial period ends, in UTC.
      example: "2026-09-03T10:30:00Z"

    theme:
      $ref: '#/ThemeMode'


UpdateUserRequest:
  type: object
  description: >
    Request to update the current user's profile. Only the fields present in the request body
    are changed — omitted fields are left as-is.
  properties:
    displayName:
      type: string
      minLength: 1
      maxLength: 100
      description: Display name of the user.
      example: "John Doe"

    theme:
      $ref: '#/ThemeMode'


ThemeMode:
  type: string
  description: The user's preferred UI theme.
  enum:
    - light
    - dark
  example: light


UserStatus:
  type: string
  description: Current status of the application user.
  enum:
    - PENDING_VERIFICATION
    - ACTIVE
    - INACTIVE
    - SUSPENDED
  example: ACTIVE


CustomerResponse:
  type: object
  description: Full admin view of a registered user, shown in the Customers management list.
  required:
    - id
    - email
    - firstName
    - lastName
    - companyName
    - status
    - roles
    - createdAt
  properties:
    id:
      type: string
      example: "01JABC123XYZ"

    email:
      type: string
      format: email
      example: "user@example.com"

    firstName:
      type: string
      maxLength: 100
      example: "Jane"

    lastName:
      type: string
      maxLength: 100
      example: "Doe"

    companyName:
      type: string
      maxLength: 200
      example: "Acme Corp"

    jobTitle:
      type: string
      maxLength: 100
      example: "Engineering Manager"

    country:
      type: string
      maxLength: 100
      example: "United States"

    status:
      $ref: '#/UserStatus'

    roles:
      type: array
      items:
        type: string
      example:
        - USER

    trialStartDate:
      type: string
      format: date-time
      description: When the account's trial period started, in UTC.
      example: "2026-08-20T10:30:00Z"

    trialEndDate:
      type: string
      format: date-time
      description: When the account's trial period ends (or ended), in UTC.
      example: "2026-09-03T10:30:00Z"

    createdAt:
      type: string
      format: date-time
      description: When the account registered, in UTC.
      example: "2026-08-20T10:30:00Z"


CustomerPageResponse:
  type: object
  description: One page of the admin Customers list.
  required:
    - content
    - page
    - size
    - totalElements
    - totalPages
  properties:
    content:
      type: array
      items:
        $ref: '#/CustomerResponse'

    page:
      type: integer
      description: Zero-based page index of this page.
      example: 0

    size:
      type: integer
      description: Maximum number of records per page.
      example: 30

    totalElements:
      type: integer
      format: int64
      description: Total number of matching users, across all pages.
      example: 142

    totalPages:
      type: integer
      example: 5


ExtendTrialRequest:
  type: object
  required:
    - trialEndDate
  properties:
    trialEndDate:
      type: string
      format: date-time
      description: New trial end date, in UTC. Must be in the future and no more than 14 days from now.
      example: "2026-09-10T00:00:00Z"


TrialAlertsCountResponse:
  type: object
  required:
    - count
  properties:
    count:
      type: integer
      description: Number of ACTIVE users whose trial ends within the next day.
      example: 3


RegisterRequest:
  type: object
  description: Request to register a new user account.
  required:
    - firstName
    - lastName
    - companyName
    - jobTitle
    - country
    - email
  properties:
    firstName:
      type: string
      maxLength: 100
      pattern: '^\p{L}[\p{L} ''-]*$'
      example: "Jane"

    lastName:
      type: string
      maxLength: 100
      pattern: '^\p{L}[\p{L} ''-]*$'
      example: "Doe"

    companyName:
      type: string
      maxLength: 200
      pattern: '.*\S.*'
      example: "Acme Corp"

    jobTitle:
      type: string
      maxLength: 100
      pattern: '.*\S.*'
      example: "Engineering Manager"

    country:
      type: string
      maxLength: 100
      pattern: '.*\S.*'
      example: "United States"

    email:
      type: string
      format: email
      description: Email address to register and verify.
      example: "jane.doe@example.com"
