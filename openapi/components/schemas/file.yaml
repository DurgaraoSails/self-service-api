FileResponse:
  type: object
  description: >
    Metadata for one uploaded document. Never the bytes themselves — those come from
    GET /poc-files/{fileId}/content.
  required:
    - id
    - originalFilename
    - contentType
    - sizeBytes
    - uploadedAt
  properties:
    id:
      type: integer
      format: int64
      example: 42

    originalFilename:
      type: string
      description: As uploaded. Never used to build the object's storage path — see the spec.
      example: "Q3-contract-draft.pdf"

    contentType:
      type: string
      description: >
        Client-declared and echoed back for display. Verified against the file's magic bytes at
        upload time, not trusted at read time — this is what the client said, not a guarantee.
      example: "application/pdf"

    sizeBytes:
      type: integer
      format: int64
      example: 214532

    uploadedAt:
      type: string
      format: date-time
