PocOnboardingCheckRequest:
  type: object
  description: >
    A repository a team wants to onboard, checked before any POC exists for it. Only the URL is
    required; a slug is checked for availability when supplied.
  required:
    - githubUrl
    - deployBranch
  properties:
    githubUrl:
      type: string
      maxLength: 500
      description: HTTPS or SSH GitHub URL, with or without a trailing .git
      example: "https://github.com/acme/contract-agent"

    deployBranch:
      type: string
      minLength: 1
      maxLength: 255
      description: >
        The branch the team intends to deploy from. Required, because poc.yaml and the Dockerfiles
        it names are read at that branch's head - a repo whose default branch is ready says nothing
        about the feature branch a team actually deploys, and silently checking the default made a
        green result mean something other than what the team asked about. A branch that does not
        exist comes back with availableBranches populated rather than as a bare failure.
      example: "main"

    slug:
      type: string
      maxLength: 100
      nullable: true
      description: >
        The slug the team intends to use. Omitted means "not decided yet", and the slug
        availability check is skipped rather than reported as a failure.
      example: "contract-agent"

PocOnboardingCheckResponse:
  type: object
  description: >
    The result of running the platform's own manifest resolution and repository preconditions
    against a repo. Never includes repository contents beyond the manifest the team wrote.
  required:
    - repository
    - ready
    - checksPassed
    - findings
  properties:
    repository:
      type: string
      description: The owner/name the URL resolved to.
      example: "acme/contract-agent"

    ready:
      type: boolean
      description: >
        True when no finding has severity ERROR. Warnings do not block a deploy, and neither
        value can promise the POC runs — the platform can read a repo but cannot run its image.
      example: false

    manifestPresent:
      type: boolean
      description: >
        False when the repo has no poc.yaml, in which case the single-container default was
        assumed and reported as an INFO finding.
      example: true

    availableBranches:
      type: array
      nullable: true
      description: >
        Present only when deployBranch does not exist in the repository: the branches that do, so
        the caller can offer them rather than leaving the team to guess. Absent on every other
        outcome, including a successful check.
      items:
        type: string
      example: ["main", "develop"]

    checksPassed:
      type: array
      description: >
        The checks that actually ran and found nothing wrong. Not the inverse of `findings`: this
        endpoint stops at the first blocking problem, so a check absent from both lists was never
        performed - reading "no finding" as "passed" would tick a box for something never looked at.
        The portal's readiness checklist ticks exactly these.
      items:
        $ref: '#/PocOnboardingCheckId'

    findings:
      type: array
      items:
        $ref: '#/PocOnboardingFinding'

PocOnboardingFinding:
  type: object
  description: One thing the checker looked at, and what the team should do about it.
  required:
    - checkId
    - severity
    - title
    - detail
  properties:
    checkId:
      $ref: '#/PocOnboardingCheckId'

    severity:
      $ref: '#/PocOnboardingSeverity'

    title:
      type: string
      description: One short line naming the problem.
      example: "Sidecar 'api' declares no port"

    detail:
      type: string
      description: The platform's own message, verbatim where one exists.

    fix:
      type: string
      nullable: true
      description: What to change in the repo, phrased as an action.
      example: "Add 'port: 7000' to the api container in poc.yaml."

PocOnboardingSeverity:
  type: string
  description: >
    ERROR blocks a deploy. WARNING deploys but will probably misbehave — a sidecar with no
    health path still starts, it just loses startup ordering. INFO states an assumption.
  enum:
    - ERROR
    - WARNING
    - INFO

PocOnboardingCheckId:
  type: string
  description: >
    Stable identifier for each check, so the portal's readiness checklist can be tied to the
    checks the API actually performs instead of drifting from them in prose.
  enum:
    - REPO_URL
    - REPO_ACCESS
    - REPO_ARCHIVED
    - REPO_PUSH_ACCESS
    - DEPLOY_BRANCH
    - MANIFEST_ABSENT
    - MANIFEST_PARSE
    - MANIFEST_VALIDATION
    - DOCKERFILE_PRESENT
    - SIDECAR_HEALTH
    - SLUG_AVAILABLE

PocManifestGenerateRequest:
  type: object
  description: >
    A repository a team wants a poc.yaml generated for. Same shape as PocOnboardingCheckRequest,
    minus slug: generation reads and drafts a manifest, it does not check a name's availability.
  required:
    - githubUrl
    - deployBranch
  properties:
    githubUrl:
      type: string
      maxLength: 500
      description: HTTPS or SSH GitHub URL, with or without a trailing .git
      example: "https://github.com/acme/contract-agent"

    deployBranch:
      type: string
      minLength: 1
      maxLength: 255
      description: >
        The branch to read poc.yaml and repository evidence from. Required, for the same reason it
        is required on PocOnboardingCheckRequest: a manifest generated from the default branch says
        nothing about the feature branch a team actually intends to deploy.
      example: "main"

PocManifestGenerateResponse:
  type: object
  description: >
    One of three honest outcomes: the platform already covers this repository with no file needed,
    a generated (or corrected) set of files, or generation was unavailable. checkResult is always
    present, regardless of outcome, so there is always something actionable to show.
  required:
    - outcome
    - files
    - notices
    - imports
    - dockerfiles
    - assumptions
    - warnings
    - manifestWasCorrected
    - checkResult
  properties:
    outcome:
      $ref: '#/PocManifestGenerationOutcome'

    files:
      type: array
      description: >
        Every file this run produced, poc.yaml first (when present) then the rest by path. The
        current and complete way to get everything this endpoint prepared — dockerfiles/pocYaml
        below are the same content reshaped for callers that have not moved to this field yet.
      items:
        $ref: '#/PocGeneratedFile'

    notices:
      type: array
      description: >
        Everything worth a team's attention from this run, at whatever severity it actually is —
        import decisions, lint findings, a truncated tree, why generation was unavailable. The
        current and complete way to see what happened; warnings below is a filtered view of this
        for callers that have not moved to this field yet.
      items:
        $ref: '#/PocGenerationNotice'

    imports:
      type: array
      description: >
        What was read from a cloudbuild.yaml, if the repository had one and it applied to this
        outcome (empty when a valid poc.yaml already existed — the import is reported but never
        applied to an existing manifest — see IMPORT_NOT_APPLIED in notices).
      items:
        $ref: '#/PocGenerationImport'

    pocYaml:
      type: string
      nullable: true
      deprecated: true
      description: >
        Deprecated — use files (kind POC_YAML). The generated (or corrected) manifest text for
        outcome GENERATED; the platform's own shipped poc.yaml.template for outcome UNAVAILABLE, so
        there is always something to copy even when generation itself did not run; null for outcome
        NOT_NEEDED.

    dockerfiles:
      type: array
      deprecated: true
      description: >
        Deprecated — use files (kind DOCKERFILE). Dockerfiles proposed for containers that declared
        none. Advisory only — unlike pocYaml, nothing validates a Dockerfile's content, so these are
        meant for copy-and-review, never for an automatic commit. Empty outside outcome GENERATED.
      items:
        $ref: '#/PocGeneratedDockerfile'

    assumptions:
      type: array
      description: What the model inferred rather than read directly from the repository. Empty outside outcome GENERATED.
      items:
        type: string

    warnings:
      type: array
      deprecated: true
      description: >
        Deprecated — use notices (severity WARNING or ERROR). Anything worth a team's attention
        that is not a manifest violation — a credential-shaped literal found in the repository
        (never copied into the manifest), a repository tree too large to read in full, or why
        generation was unavailable.
      items:
        type: string

    manifestWasCorrected:
      type: boolean
      description: >
        True when this repository already had a poc.yaml that failed the platform's validator and
        this is a correction of it, rather than a manifest generated for a repository with none.

    checkResult:
      $ref: './poc-onboarding.yaml#/PocOnboardingCheckResponse'

PocGeneratedFile:
  type: object
  description: One file this run produced, ready to copy or download.
  required:
    - path
    - kind
    - action
    - source
    - content
    - reason
    - needsReview
  properties:
    path:
      type: string
      description: Relative to the repository root, e.g. "apps/api/Dockerfile" or "poc.yaml".
      example: "apps/api/Dockerfile"
    kind:
      type: string
      enum: [POC_YAML, DOCKERFILE, DOCKERIGNORE, CONFIG]
    action:
      type: string
      enum: [CREATE, REPLACE]
      description: >
        REPLACE means a file already existed at this path and this content is meant to overwrite
        it (e.g. a Dockerfile that copies a build output nothing in it produces — see
        DOCKERFILE_EXTERNAL_ARTIFACT). CREATE means nothing was there before.
    source:
      type: string
      enum: [TEMPLATE, MODEL, DERIVED]
      description: >
        TEMPLATE — a vetted, stack-specific template. MODEL — drafted by the configured LLM.
        DERIVED — assembled deterministically with no model call (the fallback container plan's
        poc.yaml, for instance).
    container:
      type: string
      nullable: true
      description: Which container this file belongs to, when it belongs to one specific container.
    content:
      type: string
    reason:
      type: string
      description: Why this file looks the way it does — the evidence or decision behind it.
    needsReview:
      type: boolean
      description: >
        True for anything not proven safe by a validator or a vetted template — a model-drafted
        Dockerfile for an unrecognized stack, most notably. poc.yaml is never true here: it always
        passed ManifestValidator before it reached this response.

PocGenerationNotice:
  type: object
  description: One thing worth a team's attention that is not a manifest validation violation.
  required:
    - severity
    - code
    - message
  properties:
    severity:
      $ref: '#/PocOnboardingSeverity'
    code:
      type: string
      description: >
        A stable identifier for this notice's kind (e.g. SECRET_TO_PROVISION, DOCKERFILE_ROOT_USER,
        SERVICES_MERGED). Deliberately a plain string, not an enum — a new code is additive and
        never breaks a client parsing this response. See the platform's docs for the full list.
      example: "SECRET_TO_PROVISION"
    message:
      type: string
    path:
      type: string
      nullable: true
      description: The file this notice is about, when there is one specific file.
    container:
      type: string
      nullable: true
      description: The container this notice is about, when there is one.

PocGenerationImport:
  type: object
  description: What was read from one cloudbuild.yaml.
  required:
    - sourcePath
    - services
    - settings
    - secretNames
    - unsupported
  properties:
    sourcePath:
      type: string
      example: "cloudbuild.yaml"
    services:
      type: array
      description: Cloud Run service name(s) this cloudbuild.yaml deployed. More than one means they were merged — see SERVICES_MERGED in notices.
      items:
        type: string
    settings:
      type: array
      description: Every setting actually imported, one row per value — never a secret's value, only its name.
      items:
        type: object
        required: [container, key, value]
        properties:
          container:
            type: string
          key:
            type: string
            example: "port"
          value:
            type: string
    secretNames:
      type: array
      description: Names of secrets this deploy referenced (--set-secrets) — never the Secret Manager reference they pointed at.
      items:
        type: string
    unsupported:
      type: array
      description: Settings this cloudbuild.yaml declared that were not imported, and why.
      items:
        type: object
        required: [setting, reason]
        properties:
          setting:
            type: string
          reason:
            type: string

PocGeneratedDockerfile:
  type: object
  description: A Dockerfile proposed for a container that declared none.
  required:
    - path
    - content
    - reason
  properties:
    path:
      type: string
      description: Where it belongs in the repository, from the repository root.
      example: "apps/api/Dockerfile"
    content:
      type: string
      description: The proposed Dockerfile text.
    reason:
      type: string
      description: Why this shape was proposed, and from what evidence.

PocManifestGenerationOutcome:
  type: string
  description: >
    NOT_NEEDED — the platform already covers this repository (a single root Dockerfile, or an
    existing poc.yaml that already passes the checker) without a generated file.
    GENERATED — a poc.yaml (and any proposed Dockerfiles) were produced.
    UNAVAILABLE — no draft model was reachable, generation is turned off, the repository or branch
    could not be read, or every repair attempt still failed validation. pocYaml carries the
    platform's own template in this case, never a manifest that failed validation.
  enum:
    - NOT_NEEDED
    - GENERATED
    - UNAVAILABLE
